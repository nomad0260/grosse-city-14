- type: gameMap
  id: Empty
  mapName: Empty
  mapPath: /Maps/Test/empty.yml
  minPlayers: 0
  stations:
    Empty:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: "Empty"
        - type: StationJobs
          availableJobs:
            Passenger: [ -1, -1 ]

- type: gameMap
  id: Dev
  mapName: Dev
  mapPath: /Maps/_Grosse/Dev/Dev0.yml  # Grosse-edit
  minPlayers: 0
  stations:
    Dev:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: "Dev"
        - type: StationJobs
          availableJobs:
          # Grosse-edit-start
            Worker: [ -1, -1 ]
        - type: GrosseStationZLevels
          mapsAbove:
          - /Maps/_Grosse/Dev/Dev1.yml
          - /Maps/_Grosse/Dev/Dev2.yml
          zLevelsComponentOverrides:
            - type: MapAtmosphere
              space: False
              mixture:
                volume: 2500
                immutable: True
                temperature: 293.15
                moles:
                  Oxygen: 21.82478
                  Nitrogen: 82.10312
            - type: SunShadowCycle
            - type: LightCycle
              originalColor: "#ffed75"
            - type: SunShadow
            - type: MapLight
              ambientLightColor: "#ffed75"
          # Grosse-edit-end

- type: gameMap
  id: TestTeg
  mapName: Test TEG
  mapPath: /Maps/Test/test_teg.yml
  minPlayers: 0
  stations:
    TEG:
      stationProto: TestStation
      components:
        - type: StationNameSetup
          mapNameTemplate: "TEG"
        - type: StationJobs
          availableJobs:
            ChiefEngineer: [ -1, -1 ]
