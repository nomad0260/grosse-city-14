# Базовая канистра и её варианты под каждый теплоноситель.
- type: entity
  parent: BaseItem
  id: DarkCoreCoolantCanisterEmpty
  categories: [ HideSpawnMenu ]
  name: пустая канистра хладагента РТМ
  description: Канистра под хладагент. Заправляется в синтезаторе РТМ.
  components:
  - type: Sprite
    sprite: Structures/Storage/canister.rsi
    state: grey
  - type: Item
    size: Normal
  - type: Solution
    solution:
      maxVol: 300
  - type: RefillableSolution
    solution: solution
  - type: DrainableSolution
    solution: solution
  - type: SolutionTransfer
  - type: ExaminableSolution
    solution: solution
    exactVolume: true
  - type: DarkCoreCoolantCanister
    coolantReagent: DarkCoreCoolant

- type: entity
  parent: DarkCoreCoolantCanisterEmpty
  id: DarkCoreCoolantCanisterWaterEmpty
  categories: [ HideSpawnMenu ]
  name: пустая канистра водяного хладагента РТМ
  description: Канистра под водяной теплоноситель. Дешёвый, но быстро расходуется.
  components:
  - type: Sprite
    state: blue
  - type: DarkCoreCoolantCanister
    coolantReagent: DarkCoreCoolantWater

- type: entity
  parent: DarkCoreCoolantCanisterEmpty
  id: DarkCoreCoolantCanisterPlasmaEmpty
  categories: [ HideSpawnMenu ]
  name: пустая канистра плазменного хладагента РТМ
  description: Канистра под плазменный теплоноситель. Эффективнее базового.
  components:
  - type: Sprite
    state: orange
  - type: DarkCoreCoolantCanister
    coolantReagent: DarkCoreCoolantPlasma

- type: entity
  parent: DarkCoreCoolantCanisterEmpty
  id: DarkCoreCoolantCanisterUraniumEmpty
  categories: [ HideSpawnMenu ]
  name: пустая канистра уранового хладагента РТМ
  description: Канистра под урановый теплоноситель. Самый эффективный и самый дорогой.
  components:
  - type: Sprite
    state: green
  - type: DarkCoreCoolantCanister
    coolantReagent: DarkCoreCoolantUranium

- type: entity
  parent: DarkCoreCoolantCanisterEmpty
  id: DarkCoreCoolantCanister
  name: канистра хладагента РТМ
  description: Готовая к заправке охладителей канистра с базовым хладагентом.
  components:
  - type: Solution
    solution:
      maxVol: 300
      reagents:
      - ReagentId: DarkCoreCoolant
        Quantity: 300
  - type: DarkCoreCoolantCanister
    coolantReagent: DarkCoreCoolant
    waste: false

- type: entity
  parent: DarkCoreCoolantCanisterWaterEmpty
  id: DarkCoreCoolantCanisterWater
  name: канистра водяного хладагента РТМ
  description: Водяной теплоноситель. Дешёвый, но быстрее расходуется и даёт больше отработки.
  components:
  - type: Solution
    solution:
      maxVol: 300
      reagents:
      - ReagentId: DarkCoreCoolantWater
        Quantity: 300
  - type: DarkCoreCoolantCanister
    coolantReagent: DarkCoreCoolantWater
    waste: false

- type: entity
  parent: DarkCoreCoolantCanisterPlasmaEmpty
  id: DarkCoreCoolantCanisterPlasma
  name: канистра плазменного хладагента РТМ
  description: Плазменный теплоноситель. Даёт больше холода на единицу расхода.
  components:
  - type: Solution
    solution:
      maxVol: 300
      reagents:
      - ReagentId: DarkCoreCoolantPlasma
        Quantity: 300
  - type: DarkCoreCoolantCanister
    coolantReagent: DarkCoreCoolantPlasma
    waste: false

- type: entity
  parent: DarkCoreCoolantCanisterUraniumEmpty
  id: DarkCoreCoolantCanisterUranium
  name: канистра уранового хладагента РТМ
  description: Урановый теплоноситель. Максимальная эффективность при минимальном расходе.
  components:
  - type: Solution
    solution:
      maxVol: 300
      reagents:
      - ReagentId: DarkCoreCoolantUranium
        Quantity: 300
  - type: DarkCoreCoolantCanister
    coolantReagent: DarkCoreCoolantUranium
    waste: false

- type: entity
  parent: DarkCoreCoolantCanisterEmpty
  id: DarkCoreCoolantWasteCanister
  name: канистра отработанного хладагента РТМ
  description: Отработанный теплоноситель. Сдаётся в установку переработки жидкостей.
  components:
  - type: Sprite
    state: black
  - type: Solution
    solution:
      maxVol: 300
      reagents:
      - ReagentId: DarkCoreCoolantWaste
        Quantity: 300
  - type: DarkCoreCoolantCanister
    waste: true

# Специализированные теплоносители: штатная канистра под каждый тип.
- type: entity
  parent: DarkCoreCoolantCanisterEmpty
  id: DarkCoreCoolantCanisterCryogelEmpty
  categories: [ HideSpawnMenu ]
  name: пустая канистра криогеля РТМ
  description: Канистра под криогель. Даёт холод, но вязкий и быстро расходуется.
