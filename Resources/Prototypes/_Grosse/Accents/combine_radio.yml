- type: accent
  id: CombineRadio
  fullReplacements:
  - Внимание отряд, я что-то слышал.
  - Подозрительный сектор.
  - Это не похоже на сектор 8.
  - Держаться группой.
  - Нужно доложить штабу о этой чертовщине.
  - Кто нибудь видел мой пистолет?
  - Я слышал что эти порталы могут вызывать Сифилис.
  - Осторожно, тут кто-то есть.
  - Наличие паразитов не обнаружено.
  - Подмечаю высокий уровень заражения.
  - У кого-нибудь остались аптечки?
  - Надо отступить на базу...
  - Внимание, замечен враг!
  - Вперед!

- type: accent
  id: CombineRadioCMB
  fullReplacements:
  - Пост "Стингер", говорит отряд 9, требуется поддержка в секторе 8.
  - Пост "Стингер" как слышите меня?
  - Команды 4 и 9 соедениться, ожидать подкрепление, лидер 4 принять командование
  - Командам 3 и 2 занять пост, ожидать нашего прибытия.
  - Идут доклады о биоугрозе, команда 9 и 4 занят оборону, оставшимься подраздилением идти к дельте 8. Выполнять.
  - Отойди и укрепиться, центр сообщает о поддержки с воздуха.
  - Центр, нет связи с постом "Стингер", возможный захват противником.
  - Лидер 3 не отвечает, лидер 2 принять командование.
  - Прорыв 2-ого периметра, отрядам 1 и 5 прочесать дельта 7.
  - Отряд 5 выбыл, отряд 6 принять бой, лидер 2 выбыл.
  - Отрядам у дельта 8 приготовиться начать сдерживание.
  - Отряд 6 начать развертвование мэнхеков, выдвинуться к дельта 7, противник внутри сектора.
  - Центр, запрашиваю команду стабилизации в дельта 8.
  - Центр, как слышно?

- type: accent
  id: CombineRadioMedic
  fullReplacements:
  - Держись боец.
  - Доктора вызывали?
  - Сейчас будет укольчик.
  - Стой смирно.
  - Случай запущенный.
  - Какой сильный мальчик, не двигайся.
  - Тоже потерял связь с центром?
  - Крепись, не так уж это и больно.
  - Ого, да ты красавчик.
  - Молодец, потом дам леденец.

