- type: entity
  id: BaseFrameWindowC17
  parent: BaseStructure
  name: window
  description: Don't smudge up the glass down there.
  suffix: WallC17
  abstract: true
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmack
  - type: Tag
    tags:
      - Window
  - type: Sprite
    drawdepth: Mobs
    sprite: _Grosse/Structures/Windows/full_glass.rsi
  - type: Icon
    sprite: _Grosse/Structures/Windows/full_glass.rsi
    state: full
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb {}
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Damageable
    damageModifierSet: Glass
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: ExaminableDamage
    messages: WindowMessages
  - type: Repairable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          ShardGlass:
            min: 1
            max: 2
          FullWindowCrackC17:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: InteractionPopup
    interactSuccessString: comp-window-knock
    messagePerceivedByOthers: comp-window-knock
    interactSuccessSound:
      path: /Audio/Effects/glass_knock.ogg
  - type: Appearance
  - type: StaticPrice
    price: 100
  - type: BlockWeather

- type: entity
  id: FrameWindowC17
  parent: BaseFrameWindowC17
  name: frame window
  description: Don't smudge up the glass down there.
  components:
  - type: Sprite
    sprite: _Grosse/Structures/Windows/Frames/citywindow.rsi
    offset: 0,0.25
    noRot: true
    layers:
    - state: windows1
  - type: Icon
  - type: IconSmooth
    enabled: false
    mode: NoSprite
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          ShardGlass:
            min: 1
            max: 2
      - !type:ChangeConstructionNodeBehavior
        node: WindowFrameCrack
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: FrameWindows
    node: WindowFrameWindowed
