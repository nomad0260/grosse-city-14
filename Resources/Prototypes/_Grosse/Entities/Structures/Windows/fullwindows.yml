- type: entity
  id: FullWindowC17
  parent: [BaseDeltaPressureGlass, BaseStructure]
  name: window
  description: Don't smudge up the glass down there.
  suffix: WallC17
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmack
  - type: WallMount
    arc: 360
  - type: Tag
    tags:
      - ForceFixRotations
      - Window
  - type: Sprite
    drawdepth: Mobs
    sprite: _Grosse/Structures/Windows/full_glass.rsi
  - type: Icon
    sprite: _Grosse/Structures/Windows/full_glass.rsi
    state: full
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb {}
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Damageable
    damageModifierSet: Glass
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: ExaminableDamage
    messages: WindowMessages
  - type: Repairable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          ShardGlass:
            min: 1
            max: 2
          FullWindowCrackC17:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Airtight
  - type: IconSmooth
    key: windows
    base: wall
  - type: InteractionPopup
    interactSuccessString: comp-window-knock
    messagePerceivedByOthers: comp-window-knock
    interactSuccessSound:
      path: /Audio/Effects/glass_knock.ogg
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 2
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks.rsi
  - type: StaticPrice
    price: 100
  - type: BlockWeather

- type: entity
  id: FullReinforcedWindowC17
  parent: FullWindowC17
  name: reinforced window
  description: Don't smudge up the glass down there.
  components:
  - type: Sprite
    sprite: _Grosse/Structures/Windows/full_reinforced_glass.rsi
  - type: Icon
    sprite: _Grosse/Structures/Windows/full_reinforced_glass.rsi
  - type: Damageable
    damageModifierSet: RGlass
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Repairable
    fuelCost: 10
    doAfterDelay: 2
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassReinforced:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: CombineReinforcedWindowC17
  parent: FullReinforcedWindowC17
  name: combine window
  description: Окно сделанное нашими Покровителями из смеси местных материалов и Альянса.
  components:
  - type: Sprite
    sprite: _Grosse/Structures/Windows/half_reinforced_glass.rsi
  - type: Icon
    sprite: _Grosse/Structures/Windows/half_reinforced_glass.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
