- type: entity
  id: HalfWindowC17
  parent: FullWindowC17
  name: window
  description: Don't smudge up the glass down there.
  components:
  - type: Sprite
    sprite: _Grosse/Structures/Windows/half_glass.rsi
  - type: Icon
    sprite: _Grosse/Structures/Windows/half_glass.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          ShardGlass:
            min: 1
            max: 2
          HalfWindowCrackC17:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: HalfReinforcedWindowC17
  parent: FullReinforcedWindowC17
  name: reinforced window
  description: Don't smudge up the glass down there.
  components:
  - type: Sprite
    sprite: _Grosse/Structures/Windows/half_reinforced_glass.rsi
  - type: Icon
    sprite: _Grosse/Structures/Windows/half_reinforced_glass.rsi
