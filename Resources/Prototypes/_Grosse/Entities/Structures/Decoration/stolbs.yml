- type: entity
  id: BaseStolb17
  parent: BaseStructureC17
  name: столб
  description: Столб который выполнял функции электро-передачи, еще до начала времен.
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Grosse/Structures/Lighting/Stolb/128.rsi
    drawdepth: Mobs
    noRot: false
    layers:
    - state: stolb
      offset: 0, 1.5
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.5,0.1,0.1"
        mask:
        - MachineMask
        layer:
        - MachineLayer
        density: 200
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 5
            max: 15
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

