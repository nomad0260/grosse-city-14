- type: entity
  id: CombineTrainHeadC17
  parent: CargoTankC17
  name: локомотив позда бритвы
  description: Один из новых поездов созданный нашими Покровителями, смесь гения Альянса и довоенных технологий Земли.
  components:
  - type: Sprite
    sprite: _Grosse/Structures/Railroad/trains_cmb.rsi
    layers:
      - state: train
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.25,-0.5,1.25,0.5"
        density: 5000
        mask:
        - LargeMobMask
        layer:
        - WallLayer

