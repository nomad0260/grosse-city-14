- type: entity
  id: TrainRailC17
  name: рельсы
  description: Старые ЖД пути, шпалы которых уже прогнили, а метал проржавел.
  placement:
    mode: AlignTileAny
  components:
  - type: InteractionOutline
  - type: Appearance
  - type: Sprite
    sprite: _Grosse/Structures/Railroad/rails.rsi
    drawdepth: FloorTiles
    layers:
      - state: rails-wood
        #scale: 0.6, 0.6
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepCatwalk
      params:
        volume: 8

- type: entity
  id: TrainRailMetalC17
  parent: TrainRailC17
  name: рельсы
  description: Новые стальные рельсы для поездов Альянса, наверное это не очень хорошая идея делать рельсы из металов, но не думаю что кто-нибудь бы посмел это сказать нашим Покровителям.
  components:
  - type: Sprite
    layers:
      - state: rails-metal

- type: entity
  id: TrainRailMetalCrossC17
  parent: TrainRailC17
  name: рельсы
  description: Новые стальные рельсы для поездов Альянса, наверное это не очень хорошая идея делать рельсы из металов, но не думаю что кто-нибудь бы посмел это сказать нашим Покровителям.
  components:
  - type: Sprite
    layers:
      - state: rails-crossroad
  - type: Transform
    noRot: true
