- type: entity
  id: BaseDecorVehicle
  parent: BaseShippingContainer
  suffix: Decor Vehicle C17
  abstract: true
  components:
  - type: Sprite
    scale: 1, 1

- type: entity
  id: UAZStructureC17
  parent: BaseDecorVehicle
  name: старый фургон
  description: Семейство полноприводных внедорожных фургонов и легких грузовиков с кузовом на раме и кабиной над двигателем.
  components:
  - type: Sprite
    sprite: _Grosse/Vehicles/uaz.rsi
    layers:
    - state: base
    - state: windows_tainted
    - state: windows
  - type: InteractionOutline
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.5,-0.9,1.5,0.9"
        density: 155
        mask:
        - MachineMask
        layer:
        - WallLayer

