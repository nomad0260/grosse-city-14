- type: entity
  id: OldCarGreenC17
  parent: BaseDecorVehicle
  name: старая машина
  description: Довоенная машина, время не щадит никого, поэтому она в таком плохом состоянии. К сожалению, невозможно различить марку машины.
  components:
  - type: Sprite
    sprite: _Grosse/Vehicles/old_cars.rsi
    scale: 1, 1
    state: old_car_green
  - type: InteractionOutline
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.6,-1.1,0.6,1.1"
        density: 155
        mask:
        - MachineMask
        layer:
        - WallLayer
  - type: RequireProjectileTarget
    active: true

