- type: entity
  id: PaletteC17
  parent: BaseStructure
  name: поддон с плиткой
  description: Платформа, на которую уложена керамическая плитка для удобства транспортировки.
  components:
  - type: Sprite
    sprite: _Grosse/Structures/Decoration/pallet.rsi
    layers:
    - state: pallet
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: InteractionOutline
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.4,0.3,0.4"
        density: 155
        mask:
        - MachineMask
        layer:
        - WallLayer
  - type: RequireProjectileTarget
    active: true

- type: entity
  id: RadiatorC17
  parent: GroundClockC17
  name: радиатор
  description: Радиатор центрального отопления, отопляет жил площадь для того чтобы жители не замерзли. Удобненько.
  components:
  - type: Transform
    noRot: false
  - type: Sprite
    sprite: _Grosse/rsi/hlstaff/structure/decor.rsi
    state: radiator
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,0.4,0.5,0.5"
        density: 155
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
        - BulletImpassable

- type: entity
  id: GroundClockC17
  parent: BaseStructure
  name: наземные часы
  description: Часы которые давно сбились и вроде как, перестали двигаться.
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    noRot: true
    sprite: _Grosse/rsi/hlstaff/structure/clock.rsi
    state: station_clock
  - type: InteractionOutline
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "0.17,0.25,-0.17,-0.30"
        density: 155
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
        - BulletImpassable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: RequireProjectileTarget
    active: true

- type: entity
  id: GroundPhoneC17
  parent: GroundClockC17
  name: стационнарный телефон
  description: Телефон без телефона, как бы странно это не звучало.
  components:
  - type: Sprite
    sprite: _Grosse/rsi/hlstaff/structure/decor.rsi
    state: public_phone

- type: entity
  id: BigCarpetC17
  name: big carpet
  description: This is a very big carpet...
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Grosse/Structures/carpet_of_carpets.rsi
    state: carpet
    drawdepth: -1
    offset: 0, -0.5
  - type: Clickable
  - type: InteractionOutline
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialCloth1:
            min: 4
            max: 8
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
           bounds: "-1.5,-1,1.5,1"
        density: 10
        hard: false
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Physics
    bodyType: Static

- type: entity
  parent: BaseStructure
  id: BoxWoodenC17
  name: wooden box
  description: A big wooden box with many hidden toys. Maybe.
  components:
  - type: Sprite
    sprite: _Grosse/Structures/Decoration/box.rsi
    state: box
    noRot: true
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 3
            max: 5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          - bounds: -0.3, -0.45, 0.3, 0.45
        density: 100
        hard: true
        layer:
        - MachineLayer
        mask:
        - MachineMask

