
- type: entity
  id: GasStation17
  parent: BaseStructure
  name: бензоколонка
  description: Старая бензоколонка, врядли она работает.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Grosse/rsi/Structures/Decoration/gasstation.rsi
    state: gasstation
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.08,-0.08,0.08,0.08"
        mask:
        - TabletopMachineMask
        layer:
        - TabletopMachineLayer
        density: 200
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
