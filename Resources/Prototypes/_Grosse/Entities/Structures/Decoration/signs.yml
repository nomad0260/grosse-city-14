  description: Знак обозначающий автобусную остановку.
  suffix: Дорожный знак
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Grosse/rsi/Structures/Decoration/road_sign.rsi
    offset: "0, 0.25"
    layers:
    - state: busstop
  - type: Physics
    canCollide: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.10,-0.5,0.10,0.5"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - TableLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      #- !type:PlaySoundBehavior
        #sound:
          #path: /Audio/Effects/metalbreak.ogg #Нету звука
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

