
- type: entity
  parent: BaseSign
  id: RadSignC17
  name: знак "Радиация"
  description: На знаке изображён символ радиоактивной опасности, который информирует о радиоактивной опасности за знаком. Может, не стоит туда идти?
  components:
  - type: Sprite
    sprite: _Grosse/rsi/Furniture/RadSigns.rsi
    layers:
    - state: radioactive_sign1
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: Physics
    canCollide: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.10,-0.5,0.10,0.5"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - TableLayer
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        radioactive_sign1: ""
        radioactive_sign2: ""
        radioactive_sign3: ""
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      #- !type:PlaySoundBehavior
        #sound:
          #path: /Audio/Effects/metalbreak.ogg #Нету звука
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

