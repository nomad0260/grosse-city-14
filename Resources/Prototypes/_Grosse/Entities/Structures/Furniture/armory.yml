  id: AKWeaponArmoryC17
  name: kalashnikov's armory
  description: Tra-ta-ta-ta-ta! Take a gun right now!
  components:
  - type: ItemSlots
    slots:
      weapon1:
        insertVerbText: weapon-rack-verb-insert-weapon-01
        ejectVerbText: weapon-rack-verb-eject-weapon-01
        name: weapon-rack-name-stored-weapon-slot
        whitelist:
          tags:
