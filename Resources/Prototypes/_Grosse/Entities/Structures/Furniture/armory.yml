- type: entity
  id: StructureWeaponRackBase
  name: weapon rack
  parent: BaseStructure
  abstract: true
  description: A storage unit for expedited pacification measures.
  components:
  - type: Anchorable
  - type: InteractionOutline
  - type: Transform
    anchored: true
    noRot: true
  - type: Sprite
    snapCardinals: true
    noRot: true
    sprite: _Grosse/Structures/Furniture/gun-armory.rsi
    layers:
    - state: storage-empty
  - type: Appearance
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
