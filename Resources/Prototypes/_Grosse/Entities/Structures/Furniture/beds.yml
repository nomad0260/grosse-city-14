- type: entity
  parent: Mattress
  id: MattressC17
  name: матрас
  description: Лучше спать на этом, чем на полу, я думаю.
  components:
  - type: Sprite
    sprite: _Grosse/rsi/Furniture/beds.rsi
    state: matras

- type: entity
  parent: MattressC17
  id: Mattress2C17
  suffix: кроватный чистый матрас
  components:
  - type: Sprite
    sprite: _Grosse/rsi/Furniture/beds.rsi
    layers:
    - state: filthy_mattress
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        filthy_mattress: ""
        stained_mattress: ""
        stale_mattress: ""

- type: entity
  parent: MattressC17
  id: Mattress3C17
  suffix: кроватный грязный матрас
  components:
  - type: Sprite
    sprite: _Grosse/rsi/Furniture/beds.rsi
    layers:
    - state: dirty_mattress
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        dirty_mattress: ""
        old_mattress: ""
        yellowed_mattress: ""

- type: entity
  name: кровать
  id: BedCarcaseC17
  parent: BaseStructure
  description: This is used to lie in, sleep in or strap on. Resting here provides extremely slow healing.
  components:
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.05"
        density: 190
        mask:
        - TableMask
  - type: Sprite
    sprite: _Grosse/rsi/Furniture/beds.rsi
    drawdepth: WallTops
    state: metal_bed
    noRot: true
  - type: PlaceableSurface
    placeCentered: true
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: # Excess damage, don't spawn entities
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Transform
    anchored: true
    noRot: true

