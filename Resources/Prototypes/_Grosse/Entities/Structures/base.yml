- type: entity
  id: BaseBrokenMachineC17
  parent: BaseStructureDynamic
  name: сломанное устройство
  description: Довоенное устройство, по идее можно починить, только толку то?
  abstract: true
  components:
  - type: Sprite
    sprite: _Grosse/rsi/Structures/Decoration/broken_machine.rsi
    layers:
    - state: b1
  - type: InteractionOutline
  - type: Clickable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 6000
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 240
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 5
            max: 15
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Damageable
    damageModifierSet: StructuralSandbags
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: RequireProjectileTarget
    active: true
  - type: Tag
    tags:
      - Structure
