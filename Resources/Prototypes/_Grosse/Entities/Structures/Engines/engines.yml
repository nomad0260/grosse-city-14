- type: entity
  name: двигатель
  parent: BaseItem
  id: DesantPod
  components:
  - type: AmbientSound
    volume: 2
    range: 45
    sound:
      path: /Audio/_Grosse/Mobs/Gunship/engine_distant_loop1.ogg
  - type: ItemToggleActiveSound
    activeSound:
      path: /Audio/_Grosse/Mobs/Gunship/dropping_pod_loop1.ogg
      params:
        volume: 3
  - type: Sprite
    sprite: _Grosse/rsi/hlstaff/field.rsi
    layers:
    - state: generator
  - type: ItemToggle

- type: entity
  parent: DebugSubstationRecharging
  id: CombineGenerator17
  name: генератор Альянса
  suffix: Подстанция и генератор
  components:
  - type: Battery
    maxCharge: 2500000
    startingCharge: 2500000
  - type: BatterySelfRecharger
    autoRechargeRate: 2500000
  - type: Sprite
    sprite: _Grosse/rsi/hlstaff/structure/energygenerator.rsi
    layers:
    - state: GenTurnOnEyeMovement
    - state: CoreV2
      shader: unshaded
    - state: FieldAnimation
      shader: unshaded
  - type: ActivatableUIRequiresAccess
  - type: AccessReader
    access: [ [ "UnionBase" ] ]
  - type: PointLight
    radius: 1.5
    energy: 1
    color: blue
    castShadows: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ExplodeBehavior
      - !type:SpawnEntitiesBehavior
        spawn:
          CMBGeneratorDestroyed17:
            min: 1
            max: 1

- type: entity
  parent: MachineFrameDestroyed
  id: CMBGeneratorDestroyed17
  name: отключенный генератор Альянса
  components:
  - type: Construction
    graph: GeneratorRepair
    node: start
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: Sprite
    sprite: _Grosse/rsi/hlstaff/structure/energygenerator.rsi
    layers:
    - state: GenTurnOnEyeMovement

- type: constructionGraph
  id: GeneratorRepair
  start: start
  graph:
    - node: start
      edges:
      - to: sword
        completed:
          - !type:SpawnPrototype
            prototype: CombineGenerator17
          - !type:DeleteEntity
        steps:
          - tool: Screwing
            doAfter: 2
          - tool: Anchoring
            doAfter: 5
          - tool: Prying
            doAfter: 2
    - node: sword
      entity: CombineGenerator17
