- type: entity
  id: CombineWallRechargerC17
  name: combine wall charger
  parent: [ BaseItemRecharger, BaseWallmount ]
  components:
  - type: Sprite
    sprite: _Grosse/Structures/Wallmount/charger.rsi
    drawdepth: OverMobs
    snapCardinals: false
    layers:
    - map: ["enum.PowerChargerVisualLayers.Base"]
      state: suitcharger_03
    - map: ["enum.PowerChargerVisualLayers.Light"]
      state: suitcharger
      shader: "unshaded"
  - type: PowerChargerVisuals
    emptyState: suitcharger_03
    occupiedState: suitcharger_03
    lightStates:
      off: null
      empty: suitcharger
      charging: suitcharger
      charged: suitcharger
  - type: Charger
    chargeRate: 100
  - type: ItemSlots
    slots:
      charger_slot:
        ejectOnInteract: true
        whitelist:
          components:
          - BatteryAmmoProvider
          - Stunbaton
          - PowerCell
        blacklist:
          tags:
          - PotatoBattery
