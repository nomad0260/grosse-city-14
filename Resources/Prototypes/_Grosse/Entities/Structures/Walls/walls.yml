- type: entity
  abstract: true
  parent: BaseStructureWall
  id: BaseWallC17
  components:
  - type: Occluder # Breaks on diagonal walls
  - type: Sprite
    drawdepth: Mobs
  - type: GrosseZLevelHighGround
  - type: GrosseZGridConnector
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: WallIndestructible
  suffix: Неразрушимое
