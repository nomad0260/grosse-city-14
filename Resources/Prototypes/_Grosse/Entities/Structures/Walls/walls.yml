- type: entity
  id: WallIndestructible
  suffix: Неразрушимое
  abstract: true
  components:
  - type: Godmode

- type: entity
  parent: BaseStructure
  id: BaseFenceMetalC17
  name: стальная решетка
  description: Металлическое ограждение, отгораживающее что-то, вероятно, очень важное.
  abstract: true
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        path:
          "/Audio/Weapons/grille_hit.ogg"
  - type: Sprite
    sprite: _Grosse/rsi/Structures/Walls/fence.rsi
    drawdepth: Mobs
    offset: "0, 0.3"
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: Damageable
    damageModifierSet: FlimsyMetallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: InteractionPopup
    interactSuccessString: fence-rattle-success
    messagePerceivedByOthers: fence-rattle-success
    interactSuccessSound:
      collection: FenceRattle
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BaseFenceMetalC17
  id: FenceMetalStraightC17
  suffix: Прямой
  components:
  - type: Sprite
    layers:
    - state: straight
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.10,-0.5,0.10,0.5"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - MidImpassable
        - LowImpassable

- type: entity
  parent: BaseFenceMetalC17
  id: FenceMetalCornerC17
  suffix: Угол
  components:
  - type: Sprite
    layers:
    - state: corner
  - type: Fixtures
    fixtures:
      # needs two shapes to properly handle a triangle corner without weirdness
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.1,0.1,0.5"
        density: 1000
        mask:
        - TableMask
        layer:
        - TableLayer
      fix2:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.1,-0.1,0.1"
        density: 1000
        mask:
        - TableMask
        layer:
        - MidImpassable
        - LowImpassable

- type: entity
  parent: BaseFenceMetalC17
  id: FenceMetalEndC17
  suffix: Конец
  components:
  - type: Sprite
    layers:
    - state: end
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.5,0.1,0.0"
        density: 1000
        mask:
        - TableMask
        layer:
        - MidImpassable
        - LowImpassable

- type: entity
  parent: TableBase
  id: WallReinforcedDown
  name: низкая стена
  components:
  - type: Sprite
    sprite: Structures/Walls/solid.rsi
  - type: Icon
    sprite: Structures/Walls/solid.rsi
  - type: Damageable
    damageModifierSet: StructuralMetallicStrong
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
  - type: IconSmooth
    key: walls
    base: solid
  - type: Appearance
  - type: WallReplacementMarker
  - type: Climbable
    delay: 40
  - type: StaticPrice
    price: 150
  - type: RadiationBlocker
    resistance: 5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 80
        mask:
        - TableMask
        layer:
        - TableLayer

- type: entity
  parent: TableBase
  id: WallSteelDown
  name: низкая стена
  suffix: Обычная
  components:
  - type: Sprite
    sprite: Structures/Walls/solid.rsi
  - type: Icon
    sprite: Structures/Walls/solid.rsi
    state: rgeneric
  - type: Damageable
    damageModifierSet: StructuralMetallicStrong
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
  - type: IconSmooth
    key: walls
    base: reinf_over
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ReinforcedWallVisuals.DeconstructionStage:
        ReinforcedWallVisualLayers.Deconstruction:
          -1: { visible: false }
          0: { state: reinf_construct-0, visible: true}
          1: { state: reinf_construct-1, visible: true}
          2: { state: reinf_construct-2, visible: true}
          3: { state: reinf_construct-3, visible: true}
          4: { state: reinf_construct-4, visible: true}
          5: { state: reinf_construct-5, visible: true}
  - type: ReinforcedWallReplacementMarker
  - type: Climbable
    delay: 40
  - type: StaticPrice
    price: 150
  - type: RadiationBlocker
    resistance: 5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 80
        mask:
        - TableMask
        layer:
        - TableLayer

- type: entity
  id: InvisibleWall
  parent: BaseStructure
  name: вечная невидимая стена
  description: Have we all become invisible?
  suffix: Включите BB в панели песочницы
  placement:
    mode: SnapgridCenter
  components:
  - type: WallMount
    arc: 360
  - type: Tag
    tags:
      - ForceFixRotations
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb {}
        mask:
        - FullTileMask
        layer:
        - GlassAirlockLayer
  - type: Sprite
    drawdepth: Overdoors
    sprite: Markers/cross.rsi
    layers:
    - state: green
      shader: unshaded
    - sprite: Structures/Furniture/Tables/frame.rsi
      state: full
      shader: unshaded
  - type: Marker
  - type: Airtight

- type: entity
  id: InvisibleDirectionalWall
  parent: InvisibleWall
  name: вечная невидимая направленная стена
  components:
  - type: WallMount
    arc: 360
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,-0.28125"
        mask:
        - FullTileMask
        layer:
        - GlassAirlockLayer
  - type: Sprite
    sprite: Markers/cross.rsi
    layers:
    - state: green
      shader: unshaded
    - sprite: Structures/Windows/directional.rsi
      state: window
      shader: unshaded
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
  - type: RequireProjectileTarget
    active: true

