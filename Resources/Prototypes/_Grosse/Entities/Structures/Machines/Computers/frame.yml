- type: entity
  parent: BaseStructureComputer
  id: BaseUnionComputerC17
  name: union console
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Animateable
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmash
  - type: Computer
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: ActivatableUIRequiresPower
  - type: Sprite
    sprite: _Grosse/rsi/hlstaff/structure/console.rsi
    layers:
    - map: ["computerLayerBody"]
      state: console1
    - map: ["computerLayerKeys"]
      state: console1-unshaded
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerKeys:
          True: { visible: true, shader: unshaded }
          False: { visible: false, shader: shaded }
  - type: EmitSoundOnUIOpen
    sound:
      collection: Keyboard
      params:
        volume: -1
        variation: 0.10
        pitch: 1.10  # low pitch keyboard sounds feel kinda weird
    blacklist:
      tags:
      - NoConsoleSound
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: LightningTarget
    priority: 1
  - type: RequireProjectileTarget
  - type: Electrified
    enabled: false
    usesApcPower: true

- type: entity
  parent: BaseUnionComputerC17
  id: BaseUnionComputerDecorC17
  name: union console
  suffix: decor
  components:
  - type: UseDelay
    delay: 0.5 # prevent light-toggling auto-clickers.
  - type: SignalSwitch
    onPort: Pressed
    offPort: Pressed
    statusPort: Pressed
    clickSound:
      collection: Keyboard
      params:
        volume: -1
        variation: 0.10
        pitch: 1.10  # low pitch keyboard sounds feel kinda weird
  - type: DeviceNetwork
    deviceNetId: Wireless
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSource
    ports:
      - Pressed

- type: entity
  parent: BaseUnionComputerDecorC17
  id: UnionComputerDecor2C17
  suffix: decor
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: console2
    - map: ["computerLayerKeys"]
      state: console2-unshaded

- type: entity
  parent: BaseUnionComputerDecorC17
  id: UnionComputerDecor3C17
  suffix: decor
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: console3
    - map: ["computerLayerKeys"]
      state: console3-unshaded

- type: entity
  parent: BaseUnionComputerDecorC17
  id: UnionComputerDecor4C17
  suffix: decor
  components:
  - type: Sprite
    offset: "0, 0.25"
    drawdepth: WallMountedItems
    layers:
    - map: ["computerLayerBody"]
      state: consolemonitor
    - map: ["computerLayerKeys"]
      state: consolemonitor-unshaded
  - type: LitOnPowered
  - type: PointLight
    radius: 2
    energy: 3
    falloff: 12
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    color: "#00ffff"
    offset: "0, 0"

- type: entity
  parent: BaseStructureComputer
  id: BaseUnionMonitorC17
  name: union monitor
  suffix: decor
  placement:
    mode: SnapgridCenter
  components:
  - type: Animateable
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmash
  - type: Computer
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: ActivatableUIRequiresPower
  - type: Sprite
    sprite: _Grosse/rsi/hlstaff/structure/console.rsi
    drawdepth: WallMountedItems
    offset: "0, 0.75"
    layers:
    - map: ["computerLayerBody"]
      state: monitor1
    - map: ["computerLayerKeys"]
      state: monitor1-unshaded
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerKeys:
          True: { visible: true, shader: unshaded }
          False: { visible: false, shader: shaded }
  - type: LitOnPowered
  - type: PointLight
    radius: 2
    energy: 3
    falloff: 12
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    color: "#00ffff"
    offset: "0, 0.7"
  - type: LightningTarget
    priority: 1
  - type: RequireProjectileTarget
  - type: Electrified
    enabled: false
    usesApcPower: true
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,0.4,0.5,0.5"
        density: 25
        mask:
        - MachineMask
        layer:
        - MachineLayer

- type: entity
  parent: BaseUnionMonitorC17
  id: BaseUnionMonitor2C17
  components:
  - type: Sprite
    sprite: _Grosse/rsi/hlstaff/structure/console.rsi
    layers:
    - map: ["computerLayerBody"]
      state: monitor2
    - map: ["computerLayerKeys"]
      state: monitor2-unshaded

- type: entity
  parent: BaseUnionComputerC17
  id: BaseUnionComputerIdC17
  name: union ID card console
  description: Terminal for programming Union worker ID cards to access parts of the city.
  components:
  - type: IdCardConsole
    accessLevels:
      - UnionBase
      - UnionCP
      - UnionOTA
      - UnionAdmin
      - Engineering
    privilegedIdSlot:
      name: id-card-console-privileged-id
      ejectSound: /Audio/Machines/id_swipe.ogg
      insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
      ejectOnBreak: true
      swap: false
      whitelist:
        components:
        - IdCard
    targetIdSlot:
      name: id-card-console-target-id
      ejectSound: /Audio/Machines/id_swipe.ogg
      insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
      ejectOnBreak: true
      swap: false
      whitelist:
        components:
        - IdCard
  - type: ActivatableUI
    key: enum.IdCardConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.IdCardConsoleUiKey.Key:
        type: IdCardConsoleBoundUserInterface
  - type: CrewManifestViewer
    ownerKey: enum.IdCardConsoleUiKey.Key
  - type: Speech
    speechVerb: Robotic
    speechSounds: Pai
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: console2
    - map: ["computerLayerKeys"]
      state: console2-unshaded
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#3c5eb5"
  - type: Tag
    tags:
    - AccessBreakerImmune
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      IdCardConsole-privilegedId: !type:ContainerSlot
      IdCardConsole-targetId: !type:ContainerSlot

- type: entity
  parent: BaseUnionComputerC17
  id: UnionComputerShuttleC17
  name: union shuttle console
  description: Used to pilot a shuttle.
  components:
  - type: ShuttleConsole
  - type: ActivatableUI
    key: enum.ShuttleConsoleUiKey.Key
  - type: UserInterface
    interfaces:
        enum.ShuttleConsoleUiKey.Key:
          type: ShuttleConsoleBoundUserInterface
  - type: RadarConsole
#  - type: WorldLoader
    maxRange: 256
  - type: ItemSlots
    slots:
      disk_slot:
        name: Disk
        insertSound:
          path: /Audio/Machines/terminal_insert_disc.ogg
        ejectSound:
          path: /Audio/Machines/terminal_insert_disc.ogg
        whitelist:
          components:
          - ShuttleDestinationCoordinates
  - type: ContainerContainer
    containers:
      disk_slot: !type:ContainerSlot {}
  - type: DeviceNetwork
    deviceNetId: Wired
  - type: DeviceList
  #- type: DeviceLinkSource
    #range: 30
    #ports:
      #- ShuttleConsoleSender
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: console3
    - map: ["computerLayerKeys"]
      state: console3-unshaded

- type: entity
  parent: BaseUnionComputerC17
  id: UnionComputerC17CameraMonitor
  name: union camera monitor
  description: A surveillance camera monitor. You're watching them. Maybe.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: console3
    - map: ["computerLayerKeys"]
      state: console3-unshaded
  - type: Computer
    board: SurveillanceCameraMonitorCircuitboard
  - type: DeviceNetwork
    deviceNetId: Wired
    receiveFrequencyId: SurveillanceCamera
    transmitFrequencyId: SurveillanceCamera
  - type: WiredNetworkConnection
  - type: DeviceNetworkRequiresPower
  - type: SurveillanceCameraMonitor
  - type: ActivatableUI
    key: enum.SurveillanceCameraMonitorUiKey.Key
  - type: ActivatableUIRequiresVision
  - type: Transform
    anchored: true
  - type: UserInterface
    interfaces:
        enum.SurveillanceCameraMonitorUiKey.Key:
          type: SurveillanceCameraMonitorBoundUserInterface
        enum.WiresUiKey.Key:
          type: WiresBoundUserInterface

- type: entity
  parent: BaseUnionComputerC17
  id: UnionComputerCommsC17
  name: union communication console
  description: Используется для объявлений по станции, установки уровня тревоги.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: console1
    - map: ["computerLayerKeys"]
      state: console1-unshaded
  - type: AccessReader
    access: [["UnionCP"]]
  - type: CommunicationsConsole
    title: Альянса
    sound:
      path: /Audio/_Grosse/audio/ambience/apc_alarm_pass1.ogg
      params:
        volume: -15
    canShuttle: False
    color: "#0063a6"
    announceSentBy: false
  - type: DeviceNetwork
    transmitFrequencyId: ShuttleTimer
  - type: ActivatableUI
    key: enum.CommunicationsConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.CommunicationsConsoleUiKey.Key:
        type: CommunicationsConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface

