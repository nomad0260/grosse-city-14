- type: entity
  id: WoodenCrateC17
  name: деревянный ящик
  description: Внушительного размера ящик, для транспортировки предметов.
  parent: BaseItem
  components:
  - type: Item
    size: Huge
    sprite: _Grosse/rsi/hlstaff/misc/inhand.rsi
    inhandVisuals:
      left:
      - state: inhand-box
      right:
      - state: inhand-box
  - type: MultiHandedItem
  - type: ClothingSpeedModifier
    walkModifier: 0.75
    sprintModifier: 0.75
  - type: HeldSpeedModifier
  - type: InteractionOutline
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 3
            max: 5
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Sprite
    noRot: true
    sprite: _Grosse/rsi/Structures/Decoration/boxes.rsi
    layers:
    - state: 5
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        2: ""
        3: ""
        4: ""
        5: ""
        6: ""
        7: ""
        8: ""
        9: ""
  - type: Appearance
  - type: Storage
    grid:
    - 0,0,5,3
    maxItemSize: Normal
    storageOpenSound: /Audio/Effects/closetopen.ogg
    storageCloseSound: /Audio/Effects/closetclose.ogg
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: [ ]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        # very not dense to make it easy to pull
        density: 20
        mask:
        - MachineMask
        layer:
        - MachineLayer
