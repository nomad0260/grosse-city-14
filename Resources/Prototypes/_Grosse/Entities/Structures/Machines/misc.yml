- type: entity
  id: GasStoveC17
  parent: BaseStructureC17
  name: газовая плита
  description: Кухонная плита, использующая в качестве топлива горючий газ. Может использоваться природный газ из городской газовой сети или сжиженный газ.
  components:
  - type: Sprite
    sprite: _Grosse/Structures/Decoration/gas_stove.rsi
    layers:
    - state: gs1
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 5
            max: 15
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

