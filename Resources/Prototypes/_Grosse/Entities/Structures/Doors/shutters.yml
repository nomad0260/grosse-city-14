- type: entity
  id: ShuttersC17
  parent: [BaseDeltaPressureGlass, BaseShutter]
  components:
  - type: Occluder
    boundingBox: -0.5, -0.5, 0.5, 0.5
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
      - South
  - type: Sprite
    sprite: _Grosse/Structures/Doors/shutters.rsi
    drawdepth: Mobs
    offset: 0,0.25
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49, -0.49, 0.49, 0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - AirlockLayer
  - type: Door
    performCollisionCheck: false
    canCrush: false
    canPry: false
    openSound:
      path: /Audio/_Grosse/Effects/garage_open.ogg
      params:
        volume: -5
    closeSound:
      path: /Audio/_Grosse/Effects/garage_close.ogg
      params:
        volume: -5
