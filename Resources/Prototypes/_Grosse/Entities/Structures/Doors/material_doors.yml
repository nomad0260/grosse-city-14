- type: entity
  id: MetalDoorFallout
  name: металическая дверь
  parent: BaseMaterialDoor
  description: Обычная металическая дверь.
  suffix: Двери City 14
  components:
  - type: Sprite
    sprite: _Grosse/Structures/Doors/Material/Metal/metal.rsi
    offset: 0,0.25
    noRot: true
    drawdepth: Mobs
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49, -0.2, 0.49, 0.2"
        density: 100
        mask:
        - FullTileMask
        layer:
        - AirlockLayer
  - type: Occluder
    boundingBox: -0.5, -0.5, 0.5, 0.5
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
      - South
  - type: Door
    performCollisionCheck: false
    canPry: false
    canCrush: false
    bumpOpen: false
    clickOpen: true
    closeTimeOne: 0
    closeTimeTwo: 0
    openTimeOne: 0
    openTimeTwo: 0
    openingAnimationTime: 0
    closingAnimationTime: 0
    openSound:
      path: /Audio/Effects/door_open.ogg
    closeSound:
      path: /Audio/Effects/door_close.ogg
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

