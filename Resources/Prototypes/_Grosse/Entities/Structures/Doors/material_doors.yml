#region Альянс

- type: entity
  id: MetalAltDoorFalloutUnionBase
  parent: MetalDoorFallout
  description: Крепкая стальная дверь с надёжным замком.
  suffix: Альянс, Base
  components:
  - type: Sprite
    sprite: _Grosse/Structures/Doors/Material/Metal/metal.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: AccessReader
    access: [["UnionBase"]]
  - type: Door
    performCollisionCheck: false
    canPry: false
    canCrush: false
    bumpOpen: false
    clickOpen: true
    closeTimeOne: 0
    closeTimeTwo: 0
    openTimeOne: 0
    openTimeTwo: 0
    openSound:
      path: /Audio/_Grosse/Effects/combine_button1.ogg # Звук изменён на hl-овский path: /Audio/Effects/door_open.ogg
    closeSound:
      path: /Audio/Effects/door_close.ogg
    denySound:
      path: /Audio/_Grosse/Effects/combine_button_locked.ogg
      params:
        volume: -1
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000

