- type: entity
  parent: BaseStructureComputer
  id: IndestructibleDoorFalloutWall
  name: стальная дверь
  description: Крепкая стальная дверь с надёжным замком.
  suffix: Ограничитель карты
  components:
  - type: Sprite
    sprite: _Grosse/rsi/doors/union/metalalt.rsi
    layers:
    - state: closed
  - type: IsRoof
  - type: PlacementReplacement
    key: walls
  - type: BlockWeather
  - type: SunShadowCast
  - type: Airtight
  - type: Occluder
  - type: Icon
    sprite: _Grosse/rsi/doors/union/metalalt.rsi
    state: closed
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
  - type: TriggerOnInteractHand
  - type: EmitSoundOnTrigger
    sound: /Audio/_Grosse/audio/combine/combine_button_locked.ogg
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 80
        mask:
        - FullTileMask
        layer:
        - WallLayer
