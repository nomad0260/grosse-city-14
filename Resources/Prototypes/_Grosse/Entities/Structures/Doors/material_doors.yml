- type: entity
  id: MetalAltDoorFalloutUnionBase
  parent: MetalDoorFallout
  description: Крепкая стальная дверь с надёжным замком.
  suffix: Альянс, Base
  components:
  - type: Sprite
    sprite: _Grosse/rsi/doors/union/metal.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: AccessReader
    access: [["UnionBase"]]
  - type: Door
    performCollisionCheck: false
    canPry: false
    canCrush: false
    bumpOpen: false
    clickOpen: true
    closeTimeOne: 0
    closeTimeTwo: 0
    openTimeOne: 0
    openTimeTwo: 0
    openSound:
      path: /Audio/Effects/door_open.ogg
    closeSound:
      path: /Audio/Effects/door_close.ogg
    denySound:
      path: /Audio/_Grosse/audio/combine/combine_button_locked.ogg
      params:
        volume: 2
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000

