- type: entity
  id: RefrigeratorC17
  name: refrigerator
  parent: ClosetSteelBase
  description: Giant industrial refrigerator for big kitchens.
  components:
  - type: Appearance
  - type: EntityStorageVisuals
    stateBaseClosed: secure
    stateDoorOpen: secure_open
    stateDoorClosed: secure_door
  - type: Sprite
    noRot: true
    sprite: _Grosse/Structures/Storage/fridge.rsi
    layers:
    - state: secure
      map: ["enum.StorageVisualLayers.Base"]
    - state: secure_door
      map: ["enum.StorageVisualLayers.Door"]

