- type: entity
  name: Урист Макбайн
  parent: MobHuman
  description: Жалкая кучка спецназа.
  id: MobHumanCombine
  components:
  - type: Icon
    sprite: Markers/jobs.rsi
    state: cyborg
  - type: ProtectedFromStepTriggers
  - type: Speech
    speechSounds: Combine
    soundCooldownTime: 0.1
  - type: Stamina
    critThreshold: 250
  - type: Bloodstream
    bloodMaxVolume: 20
    bloodlossThreshold: 0
  #- type: RespiratorImmunity
  - type: PressureImmunity
  - type: TemperatureProtection
  - type: Temperature
    damageCap: 0
  - type: TemperatureSpeed
    thresholds:
      100: 1
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Critical
      250: Dead
  - type: TriggerOnMobstateChange
    mobState:
    - Critical
  - type: TriggerOnSpawn
    keyOut: GotRemoved
  - type: RemoveComponentsOnTrigger
    targetUser: false
    keysIn:
    - GotRemoved
    components:
    - type: Crawler
  #  - type: SleepOnSSD
  - type: EmitSoundOnTrigger
    sound:
      collection: SoldierDeath
      params:
        volume: 3
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 300
        mask:
        - MobMask
        layer:
        - MobLayer
