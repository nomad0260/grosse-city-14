- type: entity
  id: MobBaseHeadcrabedZombie
  parent: MobBaseNpcDungeon
  categories: [ HideSpawnMenu ]
  suffix: suppa Zombie
  components:
  - type: EmoteOnDamage
    emotes:
    - PainZombie
    emoteChance: 1
  - type: Emoting
  - type: ZombieImmune
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 4
  - type: Vocal
    sounds:
      Male: ZombieHeadcrabed
      Female: ZombieHeadcrabed
      Unsexed: ZombieHeadcrabed
  - type: Speech
    speechSounds: ZombieScreemAlert
    soundCooldownTime: 0.1
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: Prying
    pryPowered: !type:Bool
        true
    force: !type:Bool
      true
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: Reactive
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcClaw
    soundHit:
        path: _Grosse/audio/blackmesa/mob/zombies/claw_strike.ogg
        params:
          volume: 1
    damage:
        types:
          Slash: 12
          Structural: 15
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: NpcFactionMember
    factions:
      - Zombie
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: EmitSoundOnTrigger
    sound:
      collection: HeadcrabDeath
      params:
        volume: 3
  - type: TemperatureProtection
  - type: Temperature
    damageCap: 0
  - type: ReplacementAccent
    accent: zombie

