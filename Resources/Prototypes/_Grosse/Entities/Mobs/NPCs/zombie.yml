- type: entity
  name: зомбированный
  id: MobHeadcrabedZombie
  parent: MobBaseHeadcrabedZombie
  suffix: suppa Zombie
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      125: Dead
  - type: Sprite
    drawdepth: Mobs
    layers:
    - state: human-template
      sprite: _Grosse/rsi/hlstaff/mobs/zombie.rsi
    - state: equipped-INNERCLOTHING
      sprite: _Grosse/rsi/hlstaff/suit/citizen.rsi
    - state: soles-equipped-FEET
      sprite: Clothing/Shoes/color.rsi
    - state: zombieoverlay
      sprite: _Grosse/rsi/hlstaff/mobs/zombie.rsi

