- type: entity
  name: муравьиный лев
  id: MobAntlion
  description: Львиный муровей.
  parent: BaseMobAntlion
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Grosse/rsi/hlstaff/mobs/antlions.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base", "movement" ]
      state: antlion
#  - type: SpriteMovement
#    movementLayers:
#      movement:
#        state: antlion_walk
#    noMovementLayers:
#      movement:
#        state: antlion
  - type: DamageStateVisuals
    states:
      Alive:
        Base: antlion
      Dead:
        Base: antlion_dead
  - type: MobState
    allowedStates:
      - Alive
      - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      125: Dead
  - type: MeleeWeapon
    damage:
      types:
        Slash: 25
    soundHit:
      path: /Audio/_Grosse/audio/blackmesa/mob/antlion/attack_single1.ogg
  - type: Stamina
    baseCritThreshold: 300
  - type: SlowOnDamage
    speedModifierThresholds:
      100: 0.8
  - type: NPCUseActionOnTarget
    actionId: ActionAntlionJump
  - type: JumpAbility
    action: ActionAntlionJump
    jumpDistance: 10
    jumpThrowSpeed: 15
    jumpSound: /Audio/_Grosse/audio/blackmesa/mob/antlion/fly1.ogg
    canCollide: false
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Grosse/audio/blackmesa/mob/antlion/land1.ogg
      params:
        volume: 1
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_Grosse/audio/blackmesa/mob/antlion/digup1.ogg
      params:
        volume: -12
  - type: RemoveComponentsOnTrigger
    keysIn:
    - trigger
    components:
    - type: AutoEmote
      emotes:
      - EmoteAntlionGrubIdle
  - type: Emoting
  - type: Vocal
    sounds:
      Male: AntlionIdleSound
      Female: AntlionIdleSound
      Unsexed: AntlionIdleSound
  - type: AutoEmote
    emotes:
    - EmoteAntlionIdle

- type: entity
  name: муравьиный рабочий
  id: MobAntlionWorker
  description: Белый муровей, если его товарищ лев, то он прав.
  parent: BaseMobAntlion
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Grosse/rsi/hlstaff/mobs/antlions.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base", "movement" ]
      state: antlionworker
#  - type: SpriteMovement
#    movementLayers:
#      movement:
#        state: antlionworker_walk
#    noMovementLayers:
#      movement:
#        state: antlionworker
  - type: DamageStateVisuals
    states:
      Alive:
        Base: antlionworker
      Dead:
        Base: antlionworker_dead
  - type: MobState
    allowedStates:
      - Alive
      - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      75: Dead
  - type: MeleeWeapon
    damage:
      types:
        Slash: 10
  - type: HTN
    rootTask:
      task: CombineSoldierCompound
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 0.5
    rechargeSound:
      path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
      params:
        volume: -100
  - type: BasicEntityAmmoProvider
    proto: AntlionSpitBullet
    capacity: 1
    count: 1
  - type: Gun
    minAngle: 2
    maxAngle: 32
    fireRate: 0.4
    useKey: false
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundGunshot:
      path: /Audio/_Grosse/audio/blackmesa/mob/antlion_worker/antlion_shoot.ogg
      params:
        volume: -2
  - type: Stamina
    baseCritThreshold: 300
  - type: SlowOnDamage
    speedModifierThresholds:
      70: 0.8
  - type: RemoveComponentsOnTrigger
    keysIn:
    - trigger
    components:
    - type: AutoEmote
      emotes:
      - EmoteAntlionGrubIdle
  - type: Emoting
  - type: Vocal
    sounds:
      Male: AntlionIdleSound
      Female: AntlionIdleSound
      Unsexed: AntlionIdleSound
  - type: AutoEmote
    emotes:
    - EmoteAntlionIdle

- type: entity
  id: AntlionSpitBullet
  name: кислотный плевок
  parent: BulletDisablerPractice
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    scale: 1.3, 2
    layers:
    - state: declone
      shader: unshaded
  - type: PointLight
    radius: 1.5
    energy: 3
    enabled: true
    color: Green
  - type: Projectile
    impactEffect: BulletImpactEffect
    damage:
      types:
        Heat: 15
    soundHit:
      path: "/Audio/Weapons/Guns/Hits/energy_meat1.ogg"
  - type: TimedDespawn
    lifetime: 2

- type: entity
  name: Страж
  id: MobAntlionGuardian
  description: Неостановимая сила улья, сносит всех кто подходит слишком близко.
  parent: BaseMobAntlion
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Grosse/rsi/hlstaff/mobs/guardian.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: guard
  - type: DamageStateVisuals
    states:
      Alive:
        Base: guard
      Dead:
        Base: guard_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      1500: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      1080: 0.8
  - type: Puller
    needsHands: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 1500
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MeleeWeapon
    attackRate: 0.5
    damage:
      types:
        Blunt: 20
    soundHit:
      path: /Audio/_Grosse/audio/blackmesa/mob/antlion_guard/shove1.ogg
  - type: MovementSpeedModifier
    baseWalkSpeed : 3
    baseSprintSpeed : 4.5
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/_Grosse/audio/blackmesa/mob/antlion_guard/antlion_guard_die1.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
  - type: MeleeThrowOnHit
    stunTime: 1
    activateOnThrown: true
    distance: 10
  - type: StaminaDamageOnHit
    damage: 16
    sound: /Audio/Weapons/boxingpunch1.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 75
        Structural: 200
  - type: NPCUseActionOnTarget
    actionId: ActionChargGuardian
  - type: JumpAbility
    action: ActionChargGuardian
    jumpDistance: 20
    jumpThrowSpeed: 15
    jumpSound: /Audio/_Grosse/audio/blackmesa/mob/antlion_guard/angry3.ogg
    canCollide: true
    collideKnockdown: 5

