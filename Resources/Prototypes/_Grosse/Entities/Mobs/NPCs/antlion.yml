- type: entity
  name: личинка
  description: Личинка муровьиного льва. Маленький.
  id: MobAntlionLarva
  parent: BaseMobAntlion
  components:
  - type: Sprite
    sprite: _Grosse/rsi/hlstaff/mobs/antlions.rsi
    drawdepth: SmallMobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: grub
  - type: NpcFactionMember
    factions:
      - SimpleNeutral
  - type: DamageStateVisuals
    states:
      Alive:
        Base: grub
      Dead:
        Base: grub_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      15: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      5: 0.8
  - type: MovementSpeedModifier
    baseWalkSpeed : 1
    baseSprintSpeed : 2
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 0
  - type: Puller
    needsHands: true
  - type: Tag
    tags:
    - CannotSuicide
    - GrubAntlion
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/_Grosse/audio/blackmesa/mob/grub/agrub_squish.ogg
          params:
            volume: -1
      - !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          FoodAntlionGrubCore:
            min: 1
            max: 1
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
      fix2:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        layer:
        - MidImpassable
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: вы погладили личинку!
    interactSuccessSound: /Audio/_Grosse/audio/blackmesa/mob/grub/agrub_die.ogg
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/_Grosse/audio/blackmesa/mob/grub/agrub_die.ogg
      params:
        volume: 1
  - type: Emoting
  - type: Vocal
    sounds:
      Male: AntlionGrubIdleSound
      Female: AntlionGrubIdleSound
      Unsexed: AntlionGrubIdleSound
  - type: RemoveComponentsOnTrigger
    keysIn:
    - trigger
    components:
    - type: AutoEmote
      emotes:
      - EmoteAntlionGrubIdle
    - type: Tag
      tags:
      - CannotSuicide
      - GrubAntlion
  - type: AutoEmote
    emotes:
    - EmoteAntlionGrubIdle
  - type: RequireProjectileTarget
    active: true
  - type: Clothing
    quickEquip: false
    sprite: _Grosse/rsi/hlstaff/mobs/grubinhand.rsi
    slots:
    - HEAD
  - type: Item
    sprite: _Grosse/rsi/hlstaff/mobs/grubinhand.rsi
    size: Normal
  - type: FireVisuals
    sprite: Mobs/Effects/onfire.rsi
    normalState: Mouse_burning
  - type: Strippable
  - type: UserInterface
    interfaces:
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
  - type: InventorySlots
  - type: Inventory
    speciesId: hamster
    templateId: hamster
    displacements:
      head:
        sizeMaps:
          32:
            sprite: Mobs/Animals/mothroach/displacement.rsi
            state: head
      mask:
        sizeMaps:
          32:
            sprite: Mobs/Animals/mothroach/displacement.rsi
            state: mask
      suitstorage:
        sizeMaps:
          32:
            sprite: Mobs/Animals/mothroach/displacement.rsi
            state: suitstorage
      eyes:
        sizeMaps:
          32:
            sprite: Mobs/Animals/mothroach/displacement.rsi
            state: eyes
      neck:
        sizeMaps:
          32:
            sprite: Mobs/Animals/mothroach/displacement.rsi
            state: neck
