
- type: entity
  name: Элитный Солдат Альянса
  id: MobCombineEliteSoldier
  parent: MobBaseCombine
  suffix: suppa Патруль Альянса 17
  components:
  - type: HTN
    rootTask:
      task: SimpleRangedHostileCompound
  - type: MindShield
    mindShieldStatusIcon: UnionEliteFaction
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 0.75
    rechargeSound:
      path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
      params:
        volume: -100
  - type: BasicEntityAmmoProvider
    proto: PulseBulletCombine
    capacity: 25
    count: 25
  - type: Damageable
    damageModifierSet: CombineArmorElite
  - type: ExplosionResistance
    damageCoefficient: 0.1
  - type: Gun
    fireRate: 4
    useKey: false
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot: /Audio/_Grosse/audio/blackmesa/hl2/weapon/ar2_fire.ogg
  - type: Sprite
    drawdepth: Mobs
    layers:
    - state: equipped-INNERCLOTHING
      sprite: _Grosse/rsi/hlstaff/suit/otaking.rsi
    - state: equipped-HAND
      sprite: Clothing/Hands/Gloves/Color/black.rsi
    - state: equipped-FEET
      sprite: Clothing/Shoes/Boots/combatboots.rsi
    - state: equipped-MASK
      sprite: _Grosse/rsi/hlstaff/gasmask/otaking.rsi
    - state: equipped-HELMET
      sprite: _Grosse/rsi/hlstaff/helmets/otaking.rsi
    - state: equipped-OUTERCLOTHING
      sprite: _Grosse/rsi/hlstaff/vests/otaking.rsi
    - state: wielded-inhand-left
      sprite: _Grosse/rsi/hlstaff/weapon/ar2/tiny.rsi
  - type: Tag
    tags:
      - CannotSuicide
      - DoorBumpOpener
      - FootstepSound
      - CanPilot
      - CombineElite
      - CombineLeader
  - type: Loadout
    prototypes: [NPCCombineSoldierElite]

