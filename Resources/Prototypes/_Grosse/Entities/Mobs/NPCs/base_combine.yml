- type: entity
  name: Урист Макбайн
  parent: MobHuman
  description: Жалкая кучка спецназа.
  id: MobHumanCombine
  components:
  - type: Icon
    sprite: Markers/jobs.rsi
    state: cyborg
  - type: ProtectedFromStepTriggers
  - type: Speech
    speechSounds: Combine
    soundCooldownTime: 0.1
  - type: Stamina
    baseCritThreshold: 250
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 50
  #- type: RespiratorImmunity
  - type: PressureImmunity
  - type: TemperatureProtection
  - type: Temperature
  - type: TemperatureDamage
    damageCap: 0
  - type: TemperatureSpeed
    thresholds:
      100: 1
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Critical
      250: Dead
  - type: TriggerOnMobstateChange
    mobState:
    - Critical
  - type: TriggerOnSpawn
    keyOut: GotRemoved
  - type: RemoveComponentsOnTrigger
    targetUser: false
    keysIn:
    - GotRemoved
    components:
    - type: Crawler
  #  - type: SleepOnSSD
  - type: EmitSoundOnTrigger
    sound:
      collection: SoldierDeath
      params:
        volume: 3
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 300
        mask:
        - MobMask
        layer:
        - MobLayer

- type: entity
  name: Британец
  id: MobBaseCombine
  parent: MobBaseHumanCombine
  categories: [ HideSpawnMenu ]
  description: They mostly come at night. Mostly.
  components:
  - type: Damageable
    damageModifierSet: CombineArmor
  - type: ReplacementAccent
    accent: CombineRadioCMB
  - type: MeleeWeapon
    damage:
        types:
          Blunt: 10
          Structural: 30
  - type: ExplosionResistance
    damageCoefficient: 0.3
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepSoldier
      params:
        volume: -2
  - type: Speech
    speechSounds: Combine
    soundCooldownTime: 0.1
  - type: HTN
    rootTask:
      task: CombineSoldierCompound
    blackboard:
      FollowCloseRange: !type:Single
        1
      FollowRange: !type:Single
        5
      RangedRange: !type:Single
        20
      MeleeRange: !type:Single
        10
      VisionRadius: !type:Single
        56
      AggroVisionRadius: !type:Single
        56
      NavClimb: !type:Bool
        true
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
  - type: EmitSoundOnTrigger
    sound:
      collection: SoldierDeath

- type: entity
  name: Солдат Альянса
  id: MobCombineSoldierAR2
  parent: MobBaseCombine
  suffix: suppa AR2 Патруль Альянса 17
  components:
  - type: HTN
    rootTask:
      task: CombineSoldierCompound
  - type: NPCImprintingOnSpawnBehaviour
    whitelist:
      tags:
      - CombineLeader
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 0.5
    rechargeSound:
      path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
      params:
        volume: -100
  - type: BasicEntityAmmoProvider
    proto: PulseBulletCombine
    capacity: 10
    count: 10
  - type: Gun
    minAngle: 4
    maxAngle: 32
    fireRate: 3
    angleIncrease: 12
    angleDecay: 20
    useKey: false
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot: /Audio/_Grosse/audio/blackmesa/hl2/weapon/ar2_fire.ogg
  - type: Sprite
    drawdepth: Mobs
    layers:
    - state: equipped-INNERCLOTHING
      sprite: _Grosse/rsi/hlstaff/suit/ota.rsi
    - state: equipped-HAND
      sprite: Clothing/Hands/Gloves/Color/black.rsi
    - state: equipped-FEET
      sprite: Clothing/Shoes/Boots/combatboots.rsi
    - state: equipped-MASK
      sprite: _Grosse/rsi/hlstaff/gasmask/ota.rsi
    - state: equipped-HELMET
      sprite: _Grosse/rsi/hlstaff/helmets/ota.rsi
    - state: equipped-OUTERCLOTHING
      sprite: _Grosse/rsi/hlstaff/vests/ota.rsi
    - state: wielded-inhand-left
      sprite: _Grosse/rsi/hlstaff/weapon/ar2/tiny.rsi
  - type: Loadout
    prototypes: [NPCCombineSoldierAR2]


- type: entity
  id: MobBaseHumanCombine
  parent: MobBaseNpcDungeon
  categories: [ HideSpawnMenu ]
  components:
  - type: NpcFactionMember
    factions:
      - Xenoborg
  - type: MindShield
    mindShieldStatusIcon: UnionFaction
  - type: StatusIcon
  - type: Damageable
    damageModifierSet: CombineArmorCP
  - type: ReplacementAccent
    accent: CombineRadio
  - type: Vocalizer
    minVocalizeInterval: 1m
    maxVocalizeInterval: 2m
    hideChat: true
  - type: DatasetVocalizer
    dataset: BlockGameAds
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepSoldier
      params:
        volume: -2
  - type: Speech
    speechSounds: Metrocop
    soundCooldownTime: 0.1
  - type: MeleeWeapon
    damage:
        types:
          Blunt: 5
          Structural: 20
  - type: TriggerOnMobstateChange
    mobState:
    - Critical
  - type: EmitSoundOnTrigger
    sound:
      collection: SoldierDeath
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: Tool
    qualities:
      - Prying
  - type: Prying
    pryPowered: !type:Bool
        true
    force: !type:Bool
      true
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: TemperatureProtection
  - type: Temperature
  - type: TemperatureDamage
    damageCap: 0
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      150: Dead
  - type: MobState
    allowedStates:
      - Alive
      - Critical
      - Dead
  - type: Metabolizer
    solutionOnBody: false
    updateInterval: 0.25
    metabolizerTypes: [ Dragon ]
    stages: [ Digestion, Bloodstream, Metabolites ]
  - type: Tag
    tags:
      - CannotSuicide
      - DoorBumpOpener
      - FootstepSound
      - CanPilot
  - type: Inventory
    templateId: carman2
