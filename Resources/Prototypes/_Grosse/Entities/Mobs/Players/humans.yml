- type: entity
  name: CP unit
  parent: MobHuman
  suffix: Альянс Civil Protection unit
  id: MobHumanCPC17
  components:
  - type: NameIdentifier
    group: GenericNumber
  - type: Icon
    sprite: Markers/jobs.rsi
    state: ertmedicaleva
  - type: Speech
    speechSounds: Metrocop
    soundCooldownTime: 0.1
  - type: Tag
    tags:
      - CombineUnit
      - CanPilot
      - FootstepSound
      - DoorBumpOpener
  - type: TriggerOnMobstateChange
    mobState:
    - Critical
  - type: EmitSoundOnTrigger
    sound:
      collection: SoldierDeath
  - type: Loadout
    prototypes: [CivilProtectionGear]
  - type: NpcFactionMember
    factions:
      - Xenoborg
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: MindShield
  - type: ShowJobIcons
  - type: ShowMindShieldIcons
  - type: Temperature
  - type: TemperatureDamage
    damageCap: 0
  - type: TriggerOnSpawn
    keyOut: GotRemoved
  - type: RemoveComponentsOnTrigger
    targetUser: false
    keysIn:
    - GotRemoved
    components:
    - type: Crawler
  #  - type: SleepOnSSD
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 300
        mask:
        - MobMask
        layer:
        - MobLayer

