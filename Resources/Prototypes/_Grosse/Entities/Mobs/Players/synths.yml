- type: entity
  name: Советник Альянса
  parent: [ SimpleMobBase, FlyingMobBase ]
  id: MobAdvisor
  description: Советует.
  components:
  - type: ComplexInteraction
  #- type: RespiratorImmunity
  - type: PressureImmunity
  - type: ShowJobIcons
  - type: ShowMindShieldIcons
  - type: Body
  - type: Hands
    showInHands: false
    hands:
      hand1:
        location: Right
      hand2:
        location: Left
    sortedHands:
    - hand1
    - hand2
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.5
    baseSprintSpeed : 4.5
  - type: Sprite
    sprite: _Grosse/rsi/hlstaff/mobs/advisor.rsi
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: advisor
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: advisor-unshaded
      shader: unshaded
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 10
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: DamageStateVisuals
    states:
      Alive:
        Base: advisor
        BaseUnshaded: advisor-unshaded
      Dead:
        Base: advisor_dead
        BaseUnshaded: advisor_dead-unshaded
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: FluorosulfuricAcid
        Quantity: 50
  - type: MeleeWeapon
    soundHit:
        path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 25
  - type: MobThresholds
    thresholds:
      0: Alive
      560: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 560
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/_Grosse/Mobs/Advisor/advisor_scream.ogg
  - type: IntrinsicRadioReceiver
  - type: ActiveRadio
    channels:
    - CMB
  - type: IntrinsicRadioTransmitter
    channels:
    - CMB
  #- type: LanguageSpeaker
  #  currentLanguage: TauCetiBasic
  #- type: LanguageKnowledge
  #  speaks:
  #  - TauCetiBasic
  #  understands:
  #  - TauCetiBasic
  - type: Access
    tags:
    - UnionBase
    - Engineering
    - UnionCP
    - UnionOTA
    - UnionAdmin
