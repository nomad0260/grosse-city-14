        showEnts: False
        occludes: True
        ent: null
      car-passenger2: !type:ContainerSlot
        showEnts: False
        occludes: True
        ent: null
      actions: !type:Container
        showEnts: False
        occludes: True
        ents: []
  - type: UnpoweredFlashlight
    toggleAction: ActionGrosseCarToggleLight
  - type: PointLight
    mask: /Textures/Effects/LightMasks/cone.png
    offset: 0,-1.0
  - type: Repairable
    fuelCost: 25
    doAfterDelay: 30
    allowSelfRepair: false
  - type: Sprite
    sprite: _Grosse/Vehicles/combineAPC.rsi
