  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.8,-1.5,0.8,1.5"
        density: 800
        restitution: 0
        hard: true
        mask:
        - MobMask
        - BulletImpassable
        layer:
        - MachineLayer
