- type: entity
  id: VehicleKraz17
  name: КрАЗ
  description: Военный грузовик, который всё ещё заводится. Три места в кабине.
  suffix: Vehicle
  components:
  - type: Transform
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          # Sized to the south RSI frame (opaque ~1.44×3.78). The sprite is locked to South and rotated with the body, so this box turns with the truck.
          bounds: "-0.8,-2.15,0.85,1.8"
        density: 400
        restitution: 0
        hard: true
        mask:
        - MobMask
        - BulletImpassable
        layer:
        - MachineLayer
  - type: GravityAffected
  - type: GrosseCar
    entryDelay: 0.8
    occupantActions:
    - ActionGrosseCarExit
    engineForce: 100000
    brakeForce: 150000
    friction: 1.5
    maxForwardSpeed: 8
    maxReverseSpeed: 3
    steerRate: 2.2
    minSteerSpeed: 0.6
    minImpactSpeed: 4
    ramMinSpeed: 4
    impactCooldown: 0.5
    impactRestitution: 0.3
    pushMultiplier: 1
    knockdownTime: 1.5
    grip: 4
    handbrakeGrip: 0.6
    handbrakeForce: 120000
    minDriftSpeed: 4
    driftSlipThreshold: 0.35
    driftDecal: GrosseCarSkid
    driftDecalSpacing: 0.35
    maxDriveDamage: 200
    occupantDamageMultiplier: 0.35
    driftSound:
      path: /Audio/_Grosse/Vehicles/tire_squeal.ogg
      params:
        loop: true
    hitSound:
      collection: GrosseCarHit
    wallImpactSound:
      collection: GrosseCarWall
    hitDamage:
      types:
        Blunt: 15
    selfDamage:
      types:
        Blunt: 5
    wallDamage:
      types:
        Blunt: 12
    ramBlacklist:
      tags:
      - Wall
    blacklistImpactCoefficient: 1.5
    slots:
    - id: driver
      name: grosse-car-slot-driver
      containerId: car-driver
      isDriver: true
      visuals: Driver
    - id: passenger
      name: grosse-car-slot-passenger
      containerId: car-passenger
      visuals: Passenger1
    - id: passenger2
      name: grosse-car-slot-passenger2
      containerId: car-passenger2
      visuals: Passenger2
  - type: SkipMobMovement
  - type: InputMover
  - type: DoAfter
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: MovementSound
    sound:
      path: /Audio/_Grosse/Machines/hummer_vehicle_drive_mono.ogg
      params:
        loop: true
  - type: UnpoweredFlashlight
    toggleAction: ActionGrosseCarToggleLight
  - type: PointLight
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    radius: 16
    energy: 4
    netsync: true
  - type: AmbientMusicMarkerGrosseCar
  - type: Instrument
    allowPercussion: false
    handheld: false
    program: 2
    bank: 100 # Defined in space-station-14.sf2
  - type: ActivatableUI
    key: enum.InstrumentUiKey.Key
    singleUser: true
    verbOnly: true
    inHandsOnly: false
    requiresComplex: false
    blockSpectators: true
    verbText: verb-instrument-openui
  - type: UserInterface
    interfaces:
      enum.InstrumentUiKey.Key:
        type: InstrumentBoundUserInterface
        requireInputValidation: false
  - type: Repairable
    fuelCost: 25
    doAfterDelay: 4
    allowSelfRepair: false
  - type: Sprite
    sprite: _Grosse/rsi/Structures/Decoration/Transport/kraz.rsi
    noRot: false
    drawdepth: OverMobs
    layers:
    - state: kraz1
      map: [ "enum.GrosseCarVisualLayers.Base" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.GrosseCarVisuals.Lights:
        enum.GrosseCarVisualLayers.Lights:
          True: { visible: true }
          False: { visible: false }
      enum.GrosseCarVisuals.Handbrake:
        enum.GrosseCarVisualLayers.Handbrake:
          True: { visible: true }
          False: { visible: false }
      enum.GrosseCarVisuals.Idle:
        enum.GrosseCarVisualLayers.Idle:
          True: { visible: true }
          False: { visible: false }
      enum.GrosseCarVisuals.Run:
        enum.GrosseCarVisualLayers.Run:
          True: { visible: true }
          False: { visible: false }
      enum.GrosseCarVisuals.Driver:
        enum.GrosseCarVisualLayers.Driver:
          True: { visible: true }
          False: { visible: false }
      enum.GrosseCarVisuals.Passenger1:
        enum.GrosseCarVisualLayers.Passenger1:
          True: { visible: true }
          False: { visible: false }
      enum.GrosseCarVisuals.Passenger2:
        enum.GrosseCarVisualLayers.Passenger2:
          True: { visible: true }
          False: { visible: false }
  - type: ContainerContainer
    containers:
      car-driver: !type:ContainerSlot
        showEnts: False
        occludes: True
        ent: null
      car-passenger: !type:ContainerSlot
        showEnts: False
        occludes: True
        ent: null
      car-passenger2: !type:ContainerSlot
        showEnts: False
        occludes: True
        ent: null
      actions: !type:Container
        showEnts: False
        occludes: True
        ents: []
  - type: ActionsContainer
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyContainersBehaviour
        containers:
        - car-driver
        - car-passenger
        - car-passenger2
      - !type:DoActsBehavior
        acts: ["Destruction"]
