- type: entity
  id: BaseVehicleC17
  suffix: Vehicle C17
  abstract: true
  components:
  - type: Transform
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.8,-1.0,0.8,1.0"
        density: 200
        restitution: 0
        hard: true
        mask:
        - MobMask
        - BulletImpassable
        layer:
        - MachineLayer
  - type: GravityAffected
  - type: GrosseCar
    entryDelay: 0.8 #Скорость входа в авто
    occupantActions: #Активка выхода
    - ActionGrosseCarExit
    engineForce: 50000 #Сила двигателя
    brakeForce: 100000 #Сила ручника
    friction: 1.5 #Скольжение
    maxForwardSpeed: 8 #Макс. Скорость
    maxReverseSpeed: 3 #Макс. Скорость задним ходом
    steerRate: 2 #Скорость поворота
    minSteerSpeed: 0.5 #Мин. Скорость для поворота
    minImpactSpeed: 4 #Мин. Скорость для удара
    ramMinSpeed: 4 #Мин. Скорость для сбития препятствия (в то числе людей)
    impactCooldown: 0.5 #Откат удара
    impactRestitution: 0.3 #ХЗ, чет важное наверное
    pushMultiplier: 1 #Насколько далеко откинет препятствие
    knockdownTime: 1.5 #На сколько долго человек будет в стане
    grip: 4 #Передачи, по сути множитель скорости
    handbrakeGrip: 0.6 #Множитель ручника
    handbrakeForce: 100000 #Сила ручного ручника
    minDriftSpeed: 4 #Мин. скорость для дрифта
    driftSlipThreshold: 0.35
    driftDecal: GrosseCarSkid
    driftDecalSpacing: 0.35
    # Local tiles, same axes as the physics box. Shift so the tracks sit on the sprite center.
    driftDecalOffset: 0, 0
    maxDriveDamage: 200
    occupantDamageMultiplier: 0.35
    driftSound:
      path: /Audio/_Grosse/Vehicles/tire_squeal.ogg
      params:
        loop: true
    hitSound:
      collection: GrosseCarHit
    wallImpactSound:
      collection: GrosseCarWall
    hitDamage:
      types:
        Blunt: 15
    selfDamage:
      types:
        Blunt: 5
    wallDamage:
      types:
        Blunt: 12
    ramBlacklist:
      tags:
      - Wall
      components:
      - Door
    blacklistImpactCoefficient: 1.5
    slots:
    - id: driver
      name: grosse-car-slot-driver
      containerId: car-driver
      isDriver: true
      visuals: Driver
    - id: passenger
      name: grosse-car-slot-passenger
      containerId: car-passenger
      visuals: Passenger1
    - id: passenger2
      name: grosse-car-slot-passenger2
      containerId: car-passenger2
      visuals: Passenger2
  - type: SkipMobMovement
  - type: InputMover
  - type: DoAfter
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: MovementSound
    sound:
      path: /Audio/_Grosse/Machines/hummer_vehicle_drive_mono.ogg
      params:
        loop: true
  - type: UnpoweredFlashlight
    toggleAction: ActionGrosseCarToggleLight
  - type: PointLight
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    radius: 16
    energy: 4
    netsync: true
  - type: AmbientMusicMarkerGrosseCar
  - type: Instrument
    allowPercussion: false
    handheld: false
    program: 2
    bank: 100 # Defined in space-station-14.sf2
  - type: ActivatableUI
    key: enum.InstrumentUiKey.Key
    singleUser: true
    verbOnly: true
    inHandsOnly: false
    requiresComplex: false
    blockSpectators: true
    verbText: verb-instrument-openui
  - type: UserInterface
    interfaces:
      enum.InstrumentUiKey.Key:
        type: InstrumentBoundUserInterface
        requireInputValidation: false
  - type: Repairable
    fuelCost: 25
    doAfterDelay: 4
    allowSelfRepair: false
  - type: Sprite
    noRot: false
    drawdepth: Mobs
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.GrosseCarVisuals.Lights:
        enum.GrosseCarVisualLayers.Lights:
          True: { visible: true }
          False: { visible: false }
      enum.GrosseCarVisuals.Handbrake:
        enum.GrosseCarVisualLayers.Handbrake:
          True: { visible: true }
          False: { visible: false }
      enum.GrosseCarVisuals.Idle:
        enum.GrosseCarVisualLayers.Idle:
          True: { visible: true }
          False: { visible: false }
      enum.GrosseCarVisuals.Run:
        enum.GrosseCarVisualLayers.Run:
          True: { visible: true }
          False: { visible: false }
      enum.GrosseCarVisuals.Driver:
        enum.GrosseCarVisualLayers.Driver:
          True: { visible: true }
          False: { visible: false }
      enum.GrosseCarVisuals.Passenger1:
        enum.GrosseCarVisualLayers.Passenger1:
          True: { visible: true }
          False: { visible: false }
      enum.GrosseCarVisuals.Passenger2:
        enum.GrosseCarVisualLayers.Passenger2:
          True: { visible: true }
          False: { visible: false }
  - type: ContainerContainer
    containers:
      car-driver: !type:ContainerSlot
        showEnts: False
        occludes: True
        ent: null
      car-passenger: !type:ContainerSlot
        showEnts: False
        occludes: True
        ent: null
      car-passenger2: !type:ContainerSlot
        showEnts: False
        occludes: True
        ent: null
      actions: !type:Container
        showEnts: False
        occludes: True
        ents: []
  - type: ActionsContainer
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyContainersBehaviour
        containers:
        - car-driver
        - car-passenger
        - car-passenger2
      - !type:DoActsBehavior
        acts: ["Destruction"]
