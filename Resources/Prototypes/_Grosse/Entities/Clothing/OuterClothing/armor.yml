- type: entity
  parent: ClothingOuterEVASuitBaseC17
  id: ClothingOuterWorkerCMBC17
  name: CMB worker suit
  description: На форме присутствует маркировка «CMB Worker Group 6». На груди заметна крупная «6», а под ней написано — «Бригада».
  components:
  - type: Sprite
    sprite: _Grosse/rsi/hlstaff/vests/cmbworker.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
    - state: icon-shaded
      shader: shaded
    - state: icon-shaded
      shader: shaded
  - type: Clothing
    sprite: _Grosse/rsi/hlstaff/vests/cmbworker.rsi
    stripDelay: 5
    unequipDelay: 5
    equipDelay: 5
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING
      - state: unshaded
        shader: unshaded
      - state: shaded
        shader: shaded
      - state: shaded
        shader: shaded
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.8
        Heat: 0.5
        Shock: 0.5
  - type: Storage
    maxItemSize: Normal
    defaultStorageOrientation: Vertical
    grid:
    - 0,0,5,1
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
