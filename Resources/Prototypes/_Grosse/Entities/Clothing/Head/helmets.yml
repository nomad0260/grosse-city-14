- type: entity
  parent:
  - MaskGasTankBase
  - ClothingHeadEVAHelmetBase
  id: ClothingHeadOTAC17
  name: overwatch soldier unit helmet
  description: Military-grade helmet for special overwatch units.
  components:
  - type: TriggerOnSpawn
    keyOut: GotRemoved
  - type: RemoveComponentsOnTrigger
    targetUser: false
    keysIn:
    - GotRemoved
    components:
    - type: SlotBlock
      slots: [ head ]
  - type: Sprite
    sprite: _Grosse/rsi/hlstaff/helmets/ota.rsi
  - type: Clothing
    sprite: _Grosse/rsi/hlstaff/helmets/ota.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.9
        Heat: 0.8
  - type: ExplosionResistance
    damageCoefficient: 0.8
  - type: ToggleableClothing
    clothingPrototype: ClothingMaskOTAC17
    slot: mask
    requiredSlot:
    - head
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}
  #- type: Unremoveable

