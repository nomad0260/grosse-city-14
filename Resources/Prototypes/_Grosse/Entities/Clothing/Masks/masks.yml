- type: entity
  abstract: true
  id: MaskGasTankBase
  components:
  - type: UseDelay
    delays:
      gasTank:
        length: 1.0
  - type: ActivatableUI
    key: enum.SharedGasTankUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SharedGasTankUiKey.Key:
        type: GasTankBoundUserInterface
  - type: GasTank
    releasePressure: 21.3
    air:
      volume: 5
      temperature: 293.15
      moles:
        Oxygen: 2.051379050 # oxygen
    tankLowPressure: 30.0

- type: entity
  parent: ClothingMaskBase
  id: ClothingMaskUnionBase
  name: gas mask
  description: A face-covering mask that can be connected to an air supply.
  components:
  - type: Sprite
    sprite: Clothing/Mask/gas.rsi
  - type: Clothing
    sprite: Clothing/Mask/gas.rsi
  - type: BreathMask
  - type: IngestionBlocker
  - type: IdentityBlocker
  - type: Tag
    tags:
    - HamsterWearable
    - WhitelistChameleon
  - type: HideLayerClothing
    layers:
      Snout: Mask
    hideOnToggle: true

