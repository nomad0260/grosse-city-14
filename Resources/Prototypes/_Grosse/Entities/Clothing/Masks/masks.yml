- type: entity
  abstract: true
  id: MaskGasTankBase
  components:
  - type: UseDelay
    delays:
      gasTank:
        length: 1.0
  - type: ActivatableUI
    key: enum.SharedGasTankUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SharedGasTankUiKey.Key:
        type: GasTankBoundUserInterface
  - type: GasTank
    outputPressure: 21.3
    air:
      volume: 5
      temperature: 293.15
      moles:
        Oxygen: 2.051379050 # oxygen
    tankLowPressure: 30.0

- type: entity
  parent: ClothingMaskGas
  id: ClothingMaskOTAC17
  name: overwatch soldier unit gasmask
  description: A military-grade gas mask that can be connected to an air supply.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Grosse/rsi/hlstaff/gasmask/ota.rsi
  - type: Clothing
    sprite: _Grosse/rsi/hlstaff/gasmask/ota.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.8
        Heat: 0.7
  - type: ExplosionResistance
    damageCoefficient: 0.7
  - type: EyeProtection
  - type: FlashImmunity
  - type: ShowJobIcons
  - type: ShowMindShieldIcons
  - type: Tag
    tags:
    - HidesHair

