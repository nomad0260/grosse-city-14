- type: entity
  abstract: true
  parent: [ClothingOuterBase, AllowSuitStorageClothing]
  id: ClothingOuterEVASuitBaseC17
  name: base EVA Suit
  components:
  - type: PressureProtection
    highPressureMultiplier: 0.1
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    coefficient: 0.01
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: HeldSpeedModifier
  - type: Item
    size: Huge
  - type: Tag
    tags:
    - Hardsuit
    - WhitelistChameleon

- type: entity
  parent: ClothingOuterEVASuitBaseC17
  id: ClothingOuterArmorOTAC17
  name: overwatch soldier unit armor
  description: Military-grade suit for special overwatch units.
  components:
  - type: Sprite
    sprite: _Grosse/rsi/hlstaff/vests/ota.rsi
  - type: Clothing
    sprite: _Grosse/rsi/hlstaff/vests/ota.rsi
    stripDelay: 10
    equipDelay: 5
  #- type: Unremoveable
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: Armor
    modifiers:
#      armorLvls:
#        Piercing: 2
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.5
        Heat: 0.5
        Radiation: 0.5
        Caustic: 0.5
        Stun: 0.2
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9

