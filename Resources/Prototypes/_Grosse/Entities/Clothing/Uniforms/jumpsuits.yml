  - ClothingUniformBase
  id: ClothingUniformJumpsuitCitizenC17
  name: citizen jumpsuit
  description: Jumpsuit for city 17 citizens, looks like prisoner suit.
  components:
  - type: Sprite
    sprite: _Grosse/rsi/hlstaff/suit/citizen.rsi
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
    - state: open-icon
      map: ["foldedLayer"]
      visible: false
