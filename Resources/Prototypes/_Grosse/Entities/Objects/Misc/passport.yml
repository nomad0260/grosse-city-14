- type: entity
  id: PassportRussianFederationC17
  name: довоенный паспорт
  description: Паспорт страны что сейчас нет. Смотря на этот твердый кусок бумаги вы вспоминаете как вас везли в распределительные пукнты, там же используя паспорта идентифицировали личности людей, а паспорт забирали и давали временную идентификационную карту Галактического Альянса, если паспорта с собой не было, люди проходили более долгий курс устанавления личности. Удивительно как Альянс с самого начала ассимилировался с местными системами. Может, звертсва что приченяет Альянс это следствия нашей же системы?.. Да нет, бред.
  parent: BasePassportC17
  components:
  - type: Sprite
    layers:
    - state: iconRussia

- type: entity
  id: PassportRespublicaOfBelarusC17
  name: довоенный паспорт
  description: Паспорт страны что сейчас нет. Крутя этот кусок пластика вас нахлынывают воспоминания о былой жизни, о проблемах что вам казались глобальными... А щас, вы хотите вернуться в те временна, снова пережить все переживания угрозы ядерной войны, глобального потепления, глобальной пандемии и страха обвала рынка. Ибо хуже пришествия Альянса ничего нет, подумали вы, но вспоминаете день когда споткнулись о мешок картошки и упали лицом на коровью лепешку. Все таки пришествия Альянса не худший момент вашей жизни.
  parent: BasePassportC17
  components:
  - type: Sprite
    layers:
    - state: iconBelarus

- type: entity
  id: PassportRespublicaOfKazakhstanC17
  name: довоенный паспорт
  description: Паспорт страны что сейчас нет. Пролистывая пластиковые страницы этой твердой книжецы, вы задумываетесь, а кто щас прослушивает вас через него? Кто знает, может где-то далеко остались правительственные формирования, которые все еще слушают что там говорят граждане и записывают в блакнотик. В любом случае это просто случайные мысли, а если мыслишь, значит существуешь, а значит не все так плохо.
  parent: BasePassportC17
  components:
  - type: Sprite
    layers:
    - state: iconKazakhstan

