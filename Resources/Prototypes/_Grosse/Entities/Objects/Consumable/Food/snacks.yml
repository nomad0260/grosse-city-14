
- type: entity
  name: рацион
  parent: FoodSnackBase
  id: FoodC17Ration
  description: Пакет с питательной массой для работы на весь день, необходимые человеческой форме жизни.
  components:
  - type: FlavorProfile
    flavors:
      - nutriment
  - type: Sprite
    sprite: _Grosse/rsi/hlstaff/food.rsi
    state: standard_ration
  - type: Item
    inhandVisuals:
      left:
      - state: trash-inhand-left
        color: "white"
      right:
      - state: trash-inhand-right
        color: "white"
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: Nutriment
          Quantity: 20
        - ReagentId: Vitamin
          Quantity: 10
  - type: Edible
    trash:
    - FoodC17RationTrash

- type: entity
  categories: [ HideSpawnMenu ]
  parent: FoodPacketTrash
  id: FoodC17RationTrash
  name: пустой рацион
  components:
  - type: Sprite
    sprite: _Grosse/rsi/hlstaff/food.rsi
    state: standard_ration_open
  - type: Item
    inhandVisuals:
      left:
      - state: trash-inhand-left
        color: "white"
      right:
      - state: trash-inhand-right
        color: "white"

- type: entity
  parent: FoodSnackChocolate
  id: FoodC17WaterBarPacket
  name: плитка воды
  description: Сублимированная и спрессованная вода в удобной и очень вредной для окружающей среды обертке.
  components:
  - type: Sprite
    sprite: _Grosse/rsi/hlstaff/food.rsi
    state: bar_package
  - type: Item
    heldPrefix: susjerky
    storedOffset: 0,-1
  - type: SpawnItemsOnUse
    items:
      - id: FoodC17WaterBarPacketTrash
      - id: FoodC17WaterBar
    sound:
      path: /Audio/Effects/unwrap.ogg

