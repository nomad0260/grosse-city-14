- type: entity
  parent: BasePowerCell
  id: PowerCellCombineUnion17
  name: union power cell
  description: Батарейка Альянса.
  suffix: Full
  components:
  - type: Sprite
    sprite: _Grosse/Objects/Devices/battery.rsi
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: battery
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: o3
      shader: unshaded
  - type: BatteryVisuals
  - type: GenericVisualizer
    visuals:
      enum.BatteryVisuals.State:
        enum.PowerCellVisualLayers.Unshaded:
          Full: {visible: true, state: o3}
          Neither: {visible: true, state: o2}
          Empty: {visible: true, state: o1}
  - type: Battery
    maxCharge: 6000
    startingCharge: 6000
  - type: Tag
    tags:
    - PowerCell
    - PowerCellCombineUnion
