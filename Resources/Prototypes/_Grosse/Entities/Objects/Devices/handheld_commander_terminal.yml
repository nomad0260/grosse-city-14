- type: entity
  parent: BaseHandheldComputer
  id: HandheldCommanderTerminalC17
  name: portable commander map
  description: A pocket map of Civil Protection squads. It cannot edit groups or issue orders.
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: Objects/Devices/tablets.rsi
    layers:
    - state: tablet
    - state: generic
      shader: unshaded
  - type: ActivatableUI
    inHandsOnly: true
    singleUser: true
    key: enum.CommanderTerminalUiKey.Key
  - type: UserInterface
    interfaces:
      enum.CommanderTerminalUiKey.Key:
        type: CommanderTerminalBoundUserInterface
  - type: CommanderTerminal
    commandsEnabled: false
