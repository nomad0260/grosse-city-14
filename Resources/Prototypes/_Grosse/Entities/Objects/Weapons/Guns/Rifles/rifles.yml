
- type: entity
  name: AKMS
  parent: BaseWeaponRifle
  id: WeaponAKMSRifleResistance
  suffix: Винтовка, Оружие 17
  description: An iconic weapon of war. Uses 7.62x39 ammo.
  components:
  - type: Sprite
    sprite: _Grosse/Objects/Weapons/Guns/Rifles/ak/big.rsi
    scale: 0.85, 0.85
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Grosse/Objects/Weapons/Guns/Rifles/ak/tiny.rsi
  - type: Item
    sprite: _Grosse/Objects/Weapons/Guns/Rifles/ak/tiny.rsi
  - type: GrosseGunWieldBonus
    cameraRecoilScalar: -4
  - type: GunWieldBonus
    minAngle: -23
    maxAngle: -30
  - type: Gun
    angleDecay: 35
    angleIncrease: 4
    cameraRecoilScalar: 5
    minAngle: 24
    maxAngle: 65
    fireRate: 5
    soundGunshot:
      path: /Audio/_Grosse/Weapons/Ranged/ak47.ogg
  - type: ChamberMagazineAmmoProvider
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineRifleLight762x39
        insertSound: /Audio/_Grosse/Weapons/Ranged/ak47_reload.ogg
        ejectSound: /Audio/_Grosse/Weapons/Ranged/ak47_unload.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineLightRifle
      gun_chamber:
        name: Chamber
        startingItem: CartridgeRifleLight762x39
        priority: 1
        whitelist:
          tags:
            - CartridgeRifle762x39
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: Wieldable
  - type: UseDelay
    delay: 0.5

- type: entity
  name: AK-74U
  parent:
  - BaseFoldable
  - BaseWeaponRifle
  id: WeaponRifleAKSUResistance
  suffix: Винтовка, Оружие 17
  description: An iconic weapon of war. Uses 7.62x39 ammo.
  components:
  - type: Sprite
    sprite: _Grosse/Objects/Weapons/Guns/Rifles/aksupriklad/big.rsi
    scale: 0.8, 0.8
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base", "unfoldedLayer"]
    - state: base
      sprite: _Grosse/Objects/Weapons/Guns/Rifles/aksu/big.rsi
      map: ["foldedLayer"]
      visible: false
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Grosse/Objects/Weapons/Guns/Rifles/aksupriklad/tiny.rsi
  - type: Item
    sprite: _Grosse/Objects/Weapons/Guns/Rifles/aksupriklad/tiny.rsi
    size: Large
  - type: Foldable
    canFoldInsideContainer: true
  - type: GrosseGunWieldBonus
    cameraRecoilScalar: -3.5
  - type: GunWieldBonus
    minAngle: -23
    maxAngle: -14
  - type: Gun
    angleDecay: 35
    angleIncrease: 5.5
    cameraRecoilScalar: 5
    minAngle: 24
    maxAngle: 55
    fireRate: 5
    soundGunshot:
      path: /Audio/_Grosse/Weapons/Ranged/ak47.ogg
  - type: ChamberMagazineAmmoProvider
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineRifleLight762x39
        insertSound: /Audio/_Grosse/Weapons/Ranged/ak47_reload.ogg
        ejectSound: /Audio/_Grosse/Weapons/Ranged/ak47_unload.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineLightRifle
      gun_chamber:
        name: Chamber
        startingItem: CartridgeRifleLight762x39
        priority: 1
        whitelist:
          tags:
            - CartridgeRifle762x39
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: Wieldable
  - type: UseDelay
    delay: 0.5
