- type: entity
  name: самодельная штурмовая винтовка
  parent: BaseWeaponRifle
  id: WeaponRifleSelfmadeAK
  suffix: Винтовка, Оружие 17
  description: Наудивление хорошо сделанная подделка АК, непонятно, сделали его до войны или после, впрочем щас это уже не так важно. Использует винтовочные патроны.
  components:
  - type: Sprite
    sprite: _Grosse/Objects/Weapons/Guns/Rifles/akSM/big.rsi
    scale: 0.8, 0.8
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: [ AKMag ]
      visible: false
    - state: mag-0
      sprite: _Grosse/Objects/Weapons/Guns/SMGs/smgSMT2/big.rsi
      offset: 0.0,0.03
      map: [ SMGMag ]
      visible: false
  - type: Clothing
    sprite: _Grosse/Objects/Weapons/Guns/Rifles/akSM/tiny.rsi
  - type: Item
    sprite: _Grosse/Objects/Weapons/Guns/Rifles/akSM/tiny.rsi
    shape:
    - 0,0,3,1
    size: Large
  - type: GrosseGunWieldBonus
    cameraRecoilScalar: -3.5
  - type: GunWieldBonus
    minAngle: -23
    maxAngle: -1
  - type: Gun
    angleDecay: 35
    angleIncrease: 7
    cameraRecoilScalar: 5
    minAngle: 24
    maxAngle: 65
    fireRate: 7
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rifle2.ogg
  - type: ChamberMagazineAmmoProvider
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_Grosse/Weapons/Ranged/ak47_reload.ogg
        ejectSound: /Audio/_Grosse/Weapons/Ranged/ak47_unload.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineLightRifle
            - MagazinePistolSubMachineGun
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - CartridgeRifle762x39
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: ItemMapper
    spriteLayers:
    - AKMag
    - SMGMag
    mapLayers:
      AKMag:
        whitelist:
          tags:
          - MagazineLightRifle
      SMGMag:
        whitelist:
          tags:
          - MagazinePistolSubMachineGun
  - type: Appearance
  - type: Wieldable
  - type: UseDelay
    delay: 0.5

- type: entity
  name: самодельная болтовка
  parent: BaseItem
  id: WeaponRifleSelfmadeBoltAction
  suffix: Винтовка, Оружие 17
  description: Самодельная винтовка с продольно-скользящим затвором, самое удивительное что затвор сделан из дверного замка.
  components:
  - type: Sprite
    sprite: _Grosse/Objects/Weapons/Guns/Rifles/rifleboltactionSM/big.rsi
    scale: 0.85, 0.85
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Item
    sprite: _Grosse/Objects/Weapons/Guns/Rifles/rifleboltactionSM/tiny.rsi
    shape:
    - 0,0,4,1
    size: Large
  - type: Clothing
    sprite: _Grosse/Objects/Weapons/Guns/Rifles/rifleboltactionSM/tiny.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: Gun
    fireRate: 0.8
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/sniper.ogg
  - type: Wieldable
  - type: UseDelay
    delay: 0.8
  - type: GunRequiresWield
  - type: ChamberMagazineAmmoProvider
    autoCycle: false
  - type: ItemSlots
    slots:
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
          - CartridgeRifle762x54
          - CartridgeRifle762x39
  - type: Appearance
  - type: ContainerContainer
    containers:
      gun_chamber: !type:ContainerSlot
