- type: entity
  name: СМГ 7
  parent: BaseWeaponSubMachineGun
  id: WeaponSubMachineGunC17
  suffix: Пистолет-Пулемет, Оружие 17
  description: SMG7, также известный как MP7 — компактное автоматическое огнестрельное оружие, модифицированное Альянсом для вооружения патруля, используется всеми родами войск.
  components:
  - type: Sprite
    sprite: _Grosse/Objects/Weapons/Guns/SMGs/smg/big.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: _Grosse/Objects/Weapons/Guns/SMGs/smg/tiny.rsi
  - type: Clothing
    sprite: _Grosse/Objects/Weapons/Guns/SMGs/smg/tiny.rsi
  - type: GunRequiresWield
  - type: GrosseGunWieldBonus
    cameraRecoilScalar: -3.5
    kickMagnitudeMax: 4
  - type: GunWieldBonus
    minAngle: -23
    maxAngle: -14
  - type: Gun
    cameraRecoilScalar: 5
    angleIncrease: 5
    angleDecay: 50
    minAngle: 24
    maxAngle: 45
    fireRate: 8
    soundGunshot:
      path: /Audio/_Grosse/Weapons/Ranged/smg1_fire1.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistolSubMachineGun
        insertSound: /Audio/_Grosse/Weapons/Ranged/smg1_reload.ogg
        ejectSound: /Audio/_Grosse/Weapons/Ranged/mp5_unload.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePistolSubMachineGun
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: Wieldable
    unwieldOnUse: false

- type: entity
  name: самодельный ПП
  parent: BaseWeaponSubMachineGun
  id: WeaponSubMachineGunSelfmadeC17
  suffix: Пистолет-Пулемет, Оружие 17
  description: Самодельный пистолет-пулемет с открытым затвором, по конструкции чем-то походит на ангийский пистолет-пулемет Стэн, но в отличии от него этот не имеет хорошей подгонки компонентов, от чего качество скачет от изделия к изделию.
  components:
  - type: Sprite
    sprite: _Grosse/Objects/Weapons/Guns/SMGs/smgSM/big.rsi
    scale: 0.85, 0.85
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: _Grosse/Objects/Weapons/Guns/SMGs/smgSM/tiny.rsi
  - type: Clothing
    sprite: _Grosse/Objects/Weapons/Guns/SMGs/smgSM/tiny.rsi
  - type: GrosseGunWieldBonus
    cameraRecoilScalar: -3.5
    kickMagnitudeMax: 4
  - type: GunWieldBonus
    minAngle: -23
    maxAngle: -14
  - type: Gun
    cameraRecoilScalar: 5
    angleIncrease: 7
    angleDecay: 40
    minAngle: 24
    maxAngle: 45
    fireRate: 8
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/c-20r.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePistolSubMachineGun
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: Wieldable
    unwieldOnUse: false
  - type: Construction
    graph: SelfmadeSMG
    node: start
  - type: Tag
    tags:
    - SelfmadeSMGT1

