- type: entity
  name: SMG 7
  parent: BaseWeaponSubMachineGun
  id: WeaponSubMachineGunC17
  suffix: Пистолет-пулемёт
  description: SMG7, также известный как MP7 — компактное автоматическое огнестрельное оружие, модифицированное Альянсом для вооружения патруля, используется всеми родами войск.
  components:
  - type: Sprite
    sprite: _Grosse/rsi/hlstaff/weapon/smg/big.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: _Grosse/rsi/hlstaff/weapon/smg/tiny.rsi
  - type: Clothing
    sprite: _Grosse/rsi/hlstaff/weapon/smg/tiny.rsi
  - type: GunRequiresWield
  - type: Gun
    soundGunshot:
      path: /Audio/_Grosse/audio/blackmesa/hl2/weapon/smg1_fire1.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistolSubMachineGun
        insertSound: /Audio/_Grosse/audio/blackmesa/hl2/weapon/smg1_reload.ogg
        ejectSound: /Audio/_Grosse/audio/Weapon/Magout/mp5_unload.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePistolSubMachineGun
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: Wieldable
    unwieldOnUse: false
