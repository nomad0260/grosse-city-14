- type: entity
  name: арбалет
  parent: BaseBow
  id: WeaponCrossbowC17
  suffix: Арбалет, Оружие 17
  description: Самодельный арбалет, сделанный из подручных материалов, а боеприпасы для него лежат буквально на каждом угле, отличное оружие для введения партизанской войны.
  components:
  - type: Sprite
    sprite: _Grosse/Objects/Weapons/Guns/Bows/crossbow/big.rsi
    scale: 0.85, 0.85
    layers:
    - state: base
      map: [ base ]
    - state: mag-0
      map: [ CrossbowBolt ]
      shader: unshaded
      visible: false
  - type: Item
    sprite: _Grosse/Objects/Weapons/Guns/Bows/crossbow/tiny.rsi
    shape:
    - 0,0,3,1
    size: Large
  - type: Clothing
    sprite: _Grosse/Objects/Weapons/Guns/Bows/crossbow/tiny.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/_Grosse/Weapons/Ranged/crossbow_fire1.ogg
  - type: Wieldable
  - type: UseDelay
    delay: 0.8
  - type: GunRequiresWield
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 26
    pvsIncrease: 1.5
  - type: ItemSlots
    slots:
      projectiles:
        name: Projectiles
        startingItem: null
        disableEject: true
        swap: false
        insertSound:
          collection: CrossbowReload
        whitelist:
          tags:
          - CrossbowBolt
  - type: Appearance
  - type: ItemMapper
    spriteLayers:
    - CrossbowBolt
    mapLayers:
      CrossbowBolt:
        whitelist:
          tags:
          - CrossbowBolt
