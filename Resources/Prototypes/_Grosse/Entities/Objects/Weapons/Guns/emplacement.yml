- type: entity
  id: WeaponEmplacementCombine
  name: combine emplacement
  description: A portable Combine pulse emplacement. Sit down to man the gun.
  parent: [BaseVehicleStrap, BaseDeployFoldable, BaseItem]
  components:
  - type: Sprite
    sprite: _Grosse/Objects/Weapons/Emplacement/ar3/ar3/big.rsi
    noRot: false
    drawdepth: Mobs
    layers:
    - state: ar3
      map: ["unfoldedLayer"]
      sprite: _Grosse/Objects/Weapons/Emplacement/ar3/ar3BIG.rsi
    - state: icon
      map: ["foldedLayer"]
      visible: false
      scale: 0.9, 0.9
  - type: Item
    size: Ginormous
    sprite: _Grosse/Objects/Weapons/Emplacement/ar3/ar3/tiny.rsi
  - type: ClothingSpeedModifier
    walkModifier: 0.6
    sprintModifier: 0.6
  - type: HeldSpeedModifier
  - type: Appearance
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 360
        restitution: 0.0
        hard: true
        mask:
        - Impassable
        layer:
        - TabletopMachineLayer
  - type: Vehicle
    canAttack: true
    transferDamage: false
  - type: GrosseEmplacement
    maxYawDeviation: 22.5
    damageSplit: 0
  - type: Strap
    buckleOffset: "0, 0.5"
    position: Stand
    modifyBuckleDrawDepth: false
  - type: MouseRotator
    angleTolerance: 5
    rotationSpeed: 180
    simple4DirMode: false
  - type: CombatMode
    toggleMouseRotator: false
  - type: NoRotateOnInteract
  - type: NoRotateOnMove
  - type: Gun
    cameraRecoilScalar: 5
    minAngle: 5
    maxAngle: 25
    fireRate: 8
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundEmpty: /Audio/_Grosse/Weapons/Ranged/ar2_empty.ogg
    soundGunshot:
      path: /Audio/_Grosse/Weapons/Ranged/ar2_fire.ogg
  - type: AmmoCounter
  - type: MagazineAmmoProvider
    autoEject: false
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePulseHeavyRifleC17
        insertSound: /Audio/_Grosse/Weapons/Ranged/ar2_reload.ogg
        ejectSound: /Audio/_Grosse/Weapons/Ranged/divet_magout.ogg
        whitelist:
          tags:
            - MagazinePulseHeavyRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: RequireProjectileTarget

- type: entity
  parent: WeaponEmplacementCombine
  id: WeaponEmplacementCombineFolded
  suffix: folded
  components:
  - type: Foldable
    folded: true
  - type: Strap
    enabled: false
