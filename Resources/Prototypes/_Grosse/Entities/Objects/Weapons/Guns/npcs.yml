

- type: entity
  name: импульсный пулемет вертолета "Охотник"
  parent: BaseWeaponSniper
  id: WeaponPulseMinigunC17
  categories: [ HideSpawnMenu ]
  description: Импульсная винтовка Альянса, созданная из черной стали и использущая темную энергию, состаит в стандартном снаряжении сверх-человеческого отделения патруля Альянса и подразделения бионической пехоты Альянса.
  components:
  - type: Sprite
    sprite: _Grosse/Objects/Weapons/Guns/Energy/ar2/big.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: _Grosse/Objects/Weapons/Guns/Energy/ar2/tiny.rsi
    size: Large
  - type: Gun
    cameraRecoilScalar: 0
    minAngle: 10
    maxAngle: 25
    fireRate: 12
    soundEmpty: /Audio/_Grosse/Weapons/Ranged/ar2_empty.ogg
    soundGunshot:
      path: /Audio/_Grosse/Weapons/Ranged/ar2_fire.ogg
    selectedMode: FullAuto
    availableModes:
      - FullAuto
  - type: BallisticAmmoProvider
    capacity: 999
    cycleable: false
    proto: PulseBulletCombine
    whitelist:
      tags:
        - PulseBullet
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: TriggerOnUse
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/_Grosse/Vehicles/heli/charge_up.ogg
      params:
        volume: 2
