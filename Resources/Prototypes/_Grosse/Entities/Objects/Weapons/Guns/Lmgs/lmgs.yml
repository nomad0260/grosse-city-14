
- type: entity
  name: RPD
  parent: BaseWeaponLightMachineGun
  id: WeaponLightMachineGunRPD
  suffix: Пулемет, Оружие 17
  description: A cheap and robust machinegun, sometimes better known as an 'RPD'. Despite lacking attachment points beyond its underbarrel, remains a popular product on the black market with its cheap cost, high capacity and higher than usual caliber rounds.
  components:
  - type: Sprite
    sprite: _Grosse/Objects/Weapons/Guns/LMGs/pkm/big.rsi
    scale: 0.9, 0.9
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Grosse/Objects/Weapons/Guns/LMGs/pkm/tiny.rsi
  - type: Item
    sprite: _Grosse/Objects/Weapons/Guns/LMGs/pkm/tiny.rsi
  - type: GrosseGunWieldBonus
    cameraRecoilScalar: -4.7
  - type: GunWieldBonus
    minAngle: -30
    maxAngle: -30
  - type: Gun
    minAngle: 31
    maxAngle: 55
    angleDecay: 35
    angleIncrease: 2
    cameraRecoilScalar: 5
    fireRate: 6
    soundGunshot:
      path: /Audio/_Grosse/Weapons/Ranged/ak47.ogg
  - type: ChamberMagazineAmmoProvider
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLightMachineGun762x39
        insertSound: /Audio/_Grosse/Weapons/Ranged/ak47_reload.ogg
        ejectSound: /Audio/_Grosse/Weapons/Ranged/ak47_unload.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineLightMachineGunRPD
      gun_chamber:
        name: Chamber
        startingItem: CartridgeLightRifle
        priority: 1
        whitelist:
          tags:
            - CartridgeLightRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: Wieldable
  - type: UseDelay
    delay: 1.9
  - type: ClothingSpeedModifier
    walkModifier: 0.7
    sprintModifier: 0.7
  - type: HeldSpeedModifier
