- type: entity
  name: BaseWeaponRifle
  parent: BaseItem
  id: BaseWeaponEnergyRifle
  description: A rooty tooty point and shooty.
  abstract: true
  components:
  - type: Sprite
  - type: Item
    size: Huge
  - type: Clothing
    sprite: Objects/Weapons/Guns/Rifles/ak.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: Gun
    fireRate: 5
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot:
    sound: !type:SoundSpecifier
      path: /Audio/Weapons/Guns/Gunshots/batrifle.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLightRifle
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        priority: 1
        whitelist:
          tags:
            - MagazineLightRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
  - type: StaticPrice
    price: 5500
  - type: Appearance
  - type: Wieldable
  - type: MagazineAmmoProvider
    autoEject: true
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: true

- type: entity
  name: AR 2
  parent: BaseWeaponEnergyRifle
  id: WeaponPulseRifleAR2C17
  description: Импульсная винтовка Альянса, созданная из черной стали и использущая темную энергию, состаит в стандартном снаряжении сверх-человеческого отделения патруля Альянса и подразделения бионической пехоты Альянса.
  components:
  - type: Sprite
    sprite: _Grosse/rsi/hlstaff/weapon/ar2/big.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: _Grosse/rsi/hlstaff/weapon/ar2/tiny.rsi
    size: Large
  - type: Clothing
    sprite: _Grosse/rsi/hlstaff/weapon/ar2/tiny.rsi
  - type: GunWieldBonus
    minAngle: -23
    maxAngle: -44
  - type: Gun
    minAngle: 24
    maxAngle: 45
    fireRate: 8
    soundEmpty: /Audio/_Grosse/audio/blackmesa/hl2/weapon/ar2_empty.ogg
    soundGunshot:
    sound: !type:SoundSpecifier
      path: /Audio/_Grosse/audio/blackmesa/hl2/weapon/ar2_fire.ogg
  - type: MagazineAmmoProvider
    autoEject: false
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePulseRifleC17
        insertSound: /Audio/_Grosse/audio/blackmesa/hl2/weapon/ar2_reload.ogg
        ejectSound: /Audio/_Grosse/audio/Weapon/Magout/divet_magout.ogg
        priority: 1
        whitelist:
          tags:
            - MagazinePulseRifle
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true

- type: entity
  name: энергетический ускоритель частиц
  description: Энергетическая установка по разгону маленьких частиц в воздухе, по сути небольшой рельсотрон.
  id: WeaponCMBKineticAccelerator17
  parent: BaseItem
  components:
  - type: Sprite
    sprite: _Grosse/rsi/hlstaff/weapon/jackhummer.rsi
    layers:
    - state: jackhammer_on
    - state: jackhammer_smash_stop
      visible: false
      map: [ "empty-icon" ]
  - type: Item
    sprite: _Grosse/rsi/hlstaff/weapon/jackhummer.rsi
    size: Large
    shape:
    - 0,0,3,2
  - type: GunWieldBonus
    minAngle: -43
    maxAngle: -43
  - type: Wieldable
  - type: Gun
    fireRate: 1
    selectedMode: SemiAuto
    angleDecay: 45
    minAngle: 44
    maxAngle: 45
    availableModes:
    - SemiAuto
    soundGunshot:
    sound: !type:SoundSpecifier
      path: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg
    projectileSpeed: 25
  - type: AmmoCounter
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.AmmoVisuals.HasAmmo:
        empty-icon:
          True: { visible: False }
          False: { visible: True }
        #todo: add other 'empty' animations
  - type: BatteryAmmoProvider
    proto: BulletCMBKinetic
    fireCost: 450
  - type: ItemSlots
    slots:
      cell_slot:
        name: Magazine
        startingItem: PowerCellCombineUnion17
        insertSound: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
            - PowerCell
            - PowerCellSmall
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: Clothing
    sprite: _Grosse/rsi/hlstaff/weapon/jackhummer.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: UseDelay
    delay: 1
