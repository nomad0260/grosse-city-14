- type: job
  id: UnionWorkersHead
  name: Глава ГСР
  description: Руководи Гражданским Союзом Рабочих
  playTimeTracker: JobUnionWorkersHead
  applyTraits: true
  joinNotifyCrew: false
  overrideConsoleVisibility: true
  startingGear: HeadUnionWorker
  icon: "JobIconUnionGrey"
  supervisors: job-supervisors-city-administrator
  requirements:
    - !type:DepartmentTimeRequirement
      department: City14HighRole
      time: 5h
    - !type:DepartmentTimeRequirement
      department: City14
      time: 5h
    - !type:OverallPlaytimeRequirement
      time: 15h
    - !type:SpeciesRequirement
      species:
      - Human
