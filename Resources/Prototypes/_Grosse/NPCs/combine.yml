- type: htnCompound
  id: CombineSoldierCompound
  branches:
  - tasks:
      - !type:HTNCompoundTask
        task: RunAndGunCombatCompound
  - tasks:
      - !type:HTNCompoundTask
        task: FollowCompound
  - tasks:
      - !type:HTNCompoundTask
        task: InnateRangedCombatCompound
  - tasks:
      - !type:HTNCompoundTask
        task: IdleCompound

