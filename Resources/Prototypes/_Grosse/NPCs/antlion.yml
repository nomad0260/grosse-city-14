- type: htnCompound
  id: AntlionCompound
  branches:
    - tasks:
        - !type:HTNCompoundTask
          task: MeleeCombatCompound
    # The target is known but can't be reached on foot: break through what's in the way.
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyMeleeTargets
        - !type:HTNCompoundTask
          task: SmashBlockingObstacleCompound
    - tasks:
        - !type:HTNCompoundTask
          task: FollowCompound
    # Dig in when nothing was hunted for 10 minutes (requires Burrow + NPCIdleTracker components). Burrowing
    # comes before patrol because a new plan starts where the previous one ended, which for a patrolling
    # antlion is the patrol point it just walked to; with the patrol branch first it would always win and the
    # antlion would never dig in at all.
    - tasks:
        - !type:HTNCompoundTask
          task: AntlionBurrowCompound
    # Walk a mapper-defined patrol network. On maps without points this branch fails.
    - tasks:
        - !type:HTNCompoundTask
          task: PatrolAntlionCompound
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound

# Digs in after 10 minutes without targets, stays down for 3..5 minutes (BurrowTime is rolled from the
# MinimumBurrowTime/MaximumBurrowTime blackboard keys) and resurfaces earlier when it sees an enemy or is hit.
- type: htnCompound
  id: AntlionBurrowCompound
  branches:
    - preconditions:
        - !type:IdleTimePrecondition
          minimum: 600
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:BurrowOperator

        - !type:HTNPrimitiveTask
          operator: !type:RandomOperator
            targetKey: BurrowTime
            minKey: MinimumBurrowTime
            maxKey: MaximumBurrowTime

        - !type:HTNPrimitiveTask
          operator: !type:WaitOperator
            key: BurrowTime
          preconditions:
            - !type:KeyExistsPrecondition
              key: BurrowTime

        - !type:HTNPrimitiveTask
          operator: !type:SurfaceOperator
