- type: entity
  id: PaperCity14Rules
  name: законы Города 14
  parent: PaperPrintedCombineSign
  components:
  - type: Paper
    content: |
      Категория А - Легкие нарушения:
        Статья А-1: “Оскорбление гражданского лица” - Дискриминация, Нарушение личных границ, Оскорбление, Поведение, оскорбляющее гражданских лиц.
        Статья А-2: “Вредительство гражданам” - Поведение лица, приводящее к помехе работам граждан, Гражданского Союза Рабочих и другим рабочим объединениям, признанных Альянсом.
        Статья А-5: “Владение опасным рабочим снаряжением” - Владение частным рабочим снаряжением, предназначенное для определенной должности, по не назначению или без требуемой для получения должности.
        Статья А-6: “Нарушение порядка” - Действия, нарушающие спокойную обстановку в городах Альянса (прим.: бег, громкие звуки и тд.)
        Статья А-7: “Оборот нелегальной пищи” - Продажа/раздача пищи, несогласованная с РГ.
        Статья А-8: “Тунеядство” - Отсутствие работы у гражданина, не имеющий разрешения на свободную деятельность.
      Категория Б - Средние нарушения:
        Статья Б-1: “Оскорбления сотрудников Гражданской Обороны” - Дискриминация, Нарушение личных границ, Оскорбление, Поведение, оскорбляющее сотрудников Гражданской Обороны.
        Статья Б-2: “Помеха работе Гражданской Обороны” - Поведение лица, приводящее к неправильному исполнению или полной помехе обязанностям сотрудников Гражданской Обороны.
        Статья Б-3: “Нанесение увечий гражданам” - Нанесение увечий гражданам, не приведших к критическому состоянию или смерти.
        Статья Б-4: “Мелкая кража” - Кража предметов быта, не ценных вещей и денежных средств до 1000.
        Статья Б-7: “Оборот табачных изделий” - выращивание, использование, продажа, раздача табачных растений и изделий.
        Статья Б-8: “Неисполнение рабочих обязанностей” - Отказ от выполнения рабочих обязанностей или их ненадлежащее исполнение.
        Статья Б-9: “Неисполнение приказов Гражданской обороны” - Отказ или неправильное исполнение приказов Гражданской обороны.
      Категория С - Тяжелые нарушения:
        Статья С-1: “Оскорбления ОТА и Руководства Города” - Дискриминация, Нарушение личных границ, Оскорбление, Поведение, оскорбляющее единиц ОТА и Руководство Города.
        Статья С-3: “Убийство граждан” - Нанесение увечий гражданам, приведшее к смерти или введению в критическое состояние.
        Статья С-4: “Кража” - Кража ценностей граждан, предметов роскоши и денежных средств от 1000 до 5000.
        Статья С-5: “Владение холодным оружием” - Хранение, использование и сбыт холодного оружия.
        Статья С-6: “Нарушение работы оборудования граждан” - Нарушение работы оборудования, принадлежащее гражданским лицам, рабочим союзам и объединениям.
        Статья С-7: “Оборот алкогольных изделий” - Выращивание, использование, продажа, раздача алкогольных растений и изделий.
        Статья С-8: “Побег с рабочего места” - Побег с, официально-закрепленного за лицом, рабочего места в рабочее время, без ведомства начальства лица.
        Статья С-9: “Неисполнение приказов ОТА” - Неисполнение приказов СЧО.
      Категория Д - Критические нарушения:
        Статья Д-1: “Оскорбление Альянса” - Неодобрение действий Альянса, Оскорбление Альянса, Поведение, выставляющее Альянс в плохом виде.
        Статья Д-2: “Помеха работе ОТА и Руководству Города” - Поведение лица, приводящее к неправильному исполнению или полной помехе обязанностям юнитов ОТА и сотрудников Руководства Города.
        Статья Д-3: “Нанесение увечий сотрудникам Альянса” - Нанесение увечий ГО, ОТА и РГ, не приведшие к критическому или летальному исходу.
        Статья Д-4: “Крупная кража” - Кража ценностей сотрудников ГО и РГ. Кража вооружения ОТА. Кража денежных средств от 5000 до 10000.
        Статья Д-6: “Нарушение работы оборудования Альянса” - Нарушение работы оборудования, принадлежащее ГО и РГ.
        Статья Д-7: “Оборот Наркотических изделий” - Выращивание, использование, продажа, раздача наркотических растений и изделий.
        Статья Д-9: “Неисполнение приказов Руководства Города” - Неисполнение приказов Руководства города.
      Категория Е - Повстанческие действия:
        Статья Е-2: “Помеха работе Альянса” - Действия, направленные на свержение власти Альянса, диверсия, срыв планов Альянса.
        Статья Е-3: “Убийство сотрудников Альянса” - Нанесение увечий ГО, ОТА и РГ, приводящие к критическому состоянию и смерти.
        Статья Е-4: “Кража особо ценных технологий” - Кража оборудования Альянса, кража ценных образцов исследований Альянса, кража ценностей Альянса.
        Статья Е-5: “Владение дальнобойным и взрывоопасным вооружением” - Хранение, использование, продажа и раздача дальнобойного и взрывоопасного оружия.
        Статья Е-6: “Теракт” - Совершение действия, направленное на подрыв или иной способ уничтожения структур Альянса.
        Статья Е-9: “Неисполнение приказов Альянса” - Неисполнение постановлений Советников Альянса.

- type: entity
  id: PaperCity14BlockPosts
  name: посты ГэО
  parent: PaperPrintedCombineSign
  components:
  - type: Paper
    content: |
      распределение ГэО
      КПП - общее количество 7
        КПП на вокзале (будут выступать как те кто объясняют новеньким что да как)
          1 локальный командир
          1 сотрудника ГэО
        КПП у въезда в город
          1 локальный командир
          2 сотрудника ГэО
        КПП у предприятия
          2 сотрудника ГэО (1 из сотрудников должен иметь звание 03)
      Патрули - общее количество 13
        Патруль города
          1 локальный командир
          4 сотрудника ГэО
        Патруль трущеб (включая канализаций)
          1 локальный командир
          3 сотрудника ГэО
        Патруль внешнего периметра (сопровождение шахтеров)
          1 локальный командир
          3 сотрудника ГэО 

      Дополнение:
      Вы можете сами регулировать количество отрядов и их комплектацию, это скорее для того чтобы вы понимали основные места дислакации

- type: entity
  id: PaperGSRHead
  name: введение в курс дела
  parent: PaperPrintedCombineSign
  suffix: Глава ГСР
  components:
  - type: Paper
    content: |
      Вы глава местного отделения ГСР, с недавнего времени занявший эту позицию, вы так же являетесь частью управляющего органа Города 14.

      Краткий ввод:
      Основная ваша задача это организация работ, распределить сотрудников ГСР так, чтобы они работали
      Например:
      Уборщиками
      Инженерной бригадой
      Грузчиками
      Врачи

      Они будут в ролях разнорабочих, вы должны их самостоятельно распределить и если кого-то будет не хватить, нанять еще рабочих из числа гражданских

      Роли что уже будут раунд-стартом:
      Шахтеры
      Исследователи
      
      Ваши задачи просты, что-бы все системы города работали, чтобы свет был везде, чтобы энергия не отключалась, чтобы продуктовые автоматы были всегда полны, чтобы завод работал и производил то что надо производить, основная задача города, это выполнение квот, их можно увидеть в консолях заказов

      В том числе вы должны чтобы рабочие убрали тоннели в заброшенном районе, убирались на улицах города
      Вы должны распределять ресурсы так, чтобы никто не голодал из рабочих, используйте талоны на питание как мотиватор для сотрудников, так же вы должны выдавать каждый день гражданскому населению талоны на питание, один день длиться ровно час

- type: entity
  id: PaperFactoryHead
  name: введение в курс дела
  parent: PaperPrintedCombineSign
  suffix: Начальник завода
  components:
  - type: Paper
    content: |
      Вы начальник местного заводского района Города 14, вас назначили на эту должность за ваши выдающиеся качества лидерства.

      Краткий ввод:
      Основная ваша задача это выполнять поручения в консоли заказов, сама консоль находиться на самом заводе в КПП, около перерабатывающего цеха, записка со всеми рецептами находятся на самом заводе и у вас в кармане.
      Что вы должны делать:
      Управлять логистикой, на территории цеха находятся несколько работающих грузовиков, так же грузовики стоят у шахтерского отделения, что находится вне города, вы должны взять из разнорабочих сотрудников что будут отвечать за логистику между шахтой и пром. зоной.
      Следить за выполнением работы пром. зоны, основная задача города, это выполнение этих заказов, следите чтобы рабочие завода выполняли эти поручения, а так же нанимайте из числа разнорабочих или гражданских для выполнение целей
      Управлять добывающими процессами, вне города находятся шахты и кучи мусора в которых много железа, которые вам необходимы для производства, вы должны обеспечить то чтоб они работали и добывали ресурсы, вне города опасно, поэтому по регламенту их должны защищать отряд ГэО

- type: entity
  id: PaperWorker
  name: введение в курс дела
  parent: PaperPrintedCombineSign
  suffix: Разнорабочий
  components:
  - type: Paper
    content: |
      У вас нет работы, но вы её хотите? Поздравляю, вы теперь разнорабочий! Выполняйте любую хрень, которую от вас требуют. Не нравится? Не жалуйтесь! Слушайся ГСР!

      Краткий ввод:
      Основная ваша задача это выполнять поручения ваших глав, в зависимости от того куда вы будете назначены, вы можете попасть на завод, можете попасть на работу в трущебы и убирать канализацию, очищать сточные канали или же просто подметать улицу, а может вовсе быть водителем что доставляет ресурсы
      От вас зависит вся работа города, так что относитесь к назначению ответственно
      Краткий ввод (для тех кто хочет пойти работать на завод):
      И так вы стали пилотом самолёта начнём с простого кинь сталь в протолат, возьмии лист с рецептом и глянь что нужно собрать, выберии детальку на протолате и запустии конвейер после прохода двух секциий ты получиишь каркас, возьми листик ещё раз и вставь что нужно для создания готовой штуки, подойдии к начальнику завода, покажи ему что сделал и он скажет в ответ "нахуй нам порох если заказ на аптечки" удачи.
      От вас зависит вся работа города, так что относитесь к назначению ответственно

- type: entity
  id: PaperResearcher
  name: введение в курс дела
  parent: PaperPrintedCombineSign
  suffix: Исследователь
  components:
  - type: Paper
    content: |
      У вас есть интерес к всему новому? Поздравляю, Альянс выбрал вас в Исследователи! Берите пушки и гасите муравьиных львов, попутно воруя их яйца для медицинской мази. Нашли прикол? Принесите его своему начальнику и попросите добавку!

      Краткий ввод:
      Исследовать пустошь которая находиться правее заброшенного района , ищите гнёзда муравьино-львов у которых вы возьмёте личинок для создания крутых аптечек что нужны для выполнения квоты города , так же можете искать приключения на свою жопу в точках интереса , вы скорее всего умрёте, удачи.
      От вас зависит часть работа города, так что относитесь к назначению ответственно

- type: entity
  id: PaperMiner
  name: введение в курс дела
  parent: PaperPrintedCombineSign
  suffix: Шахтер
  components:
  - type: Paper
    content: |
      Вы безнадёжный и бедный? Поздравляю, теперь вы Шахтёр! Берите кирку, долбите камень и добывайте священные ресурсы вашей разлагающейся планеты. Вам плохо? Не жалуйтесь! Шахта разгерметизирована? Не бля увы.

      Краткий ввод:
      И так дуй в пустошь что находиться правее заброшенного района, копай ресурсы в пустоше у шахт, до них ведут указатели, не потеряешся, долби обломкии чтоб получить сталь для завода, попроси го прекрывать вашу жопу в поисках стали  ,если станет очень скучно отправся получать пиздюлей с исследователями они ваши бро, вы скорее всего умрёте, удачи.
      От вас зависит часть работа города, так что относитесь к назначению ответственно