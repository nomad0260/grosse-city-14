      У вашей айди карты система изменения значений, а в маску установлена система вокодера, вы должны установить свое имя в соответствии с регламентом в айди-карту и в голосовую маску, а должность Локальный Командир Гражданской Обороны
      Ваше имя:
      CP Unit 000.02.14
      Первые 3 нолика, это ваш индификационный номер, он должен быть уникальным
      После них идет ваше звание, в данном случае ставите 02, так как это звание локального командира.
      цифра 14 это обозначение в каком городе вы работаете, всегда должна быть 14.
      
      Сейчас вы должны идти в участок и там обратиться к СеКу или 01 чтобы он назначил вам отряд.

      Дополнение: 
      СеК - Секториальный Коммандер, главнокомандущий сил Патруля
      01 - Старший офицер, по сути ваш прямой Начальник
      02 - локальный командир, полевой офицер что руководит своим отрядом уже на посту

