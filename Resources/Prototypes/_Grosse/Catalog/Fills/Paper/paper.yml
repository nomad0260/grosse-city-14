- type: entity
  id: PaperCPUnit03
  name: введение в курс дела
  parent: PaperPrintedCombineSign
  suffix: Оперативник ГэО
  components:
  - type: Paper
    content: |
      Вы бывший член силовых структур Земли, после войны, вы сдались без боя и теперь за ваши качества и лояльность к новому правительству вас назначали сотрудником Гражданской Обороны.

      Краткий ввод:
      У вашей айди карты система изменения значений, а в маску установлена система вокодера, вы должны установить свое имя в соответствии с регламентом в айди-карту и в голосовую маску, а должность Гражданская Оборона
      Ваше имя:
      CP Unit 000.03.14
      Первые 3 нолика, это ваш индификационный номер, он должен быть уникальным
      После них идет ваше звание, в данном случае вы должны установить ваше звание сами, от 05 до 03, ставьте 05 если вы считаете себя еще зеленым новичком, 03 если вы уже понимаете что делать.
      цифра 14 это обозначение в каком городе вы работаете, всегда должна быть 14.
      
      Сейчас вы должны идти в участок и там обратиться к СеКу или 01 чтобы он назначил вас к локальному командиру.

      Дополнение: 
      СеК - Секториальный Коммандер, главнокомандущий сил Патруля
      01 - Старший офицер, по сути ваш прямой Начальник
      02 - локальный командир, полевой офицер что руководит своим отрядом уже на посту

