# Производство расходников и оборудования РТМ.
# Пустые канистры больше не печатаются: и станок Альянса, и фабрикатор сразу выдают полные.

# Альфа — стартовый патрон. Он печатается из обычных материалов, чтобы можно было
# получить первые обломки и запустить цикл без готового запаса сырья.
- type: latheRecipe
  id: DarkCoreCartridgeAlpha
  result: DarkCoreCartridgeAlpha
  completetime: 5
  materials:
    Steel: 300
    Glass: 200
    Plastic: 100
    Gold: 50
  icon:
    sprite: Structures/Machines/parts.rsi
    state: "0"

