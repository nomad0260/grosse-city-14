- type: constructionGraph
  id: WoodenBlank
  start: start
  graph:
  - node: start
    edges:
    - to: icon
      steps:
      #- tag: ManhackBlade
      #  name: construction-insert-manhack-blades
      #  icon:
      #    sprite: _Grosse/rsi/hlstaff/misc/material.rsi
      #    state: sheet-scrapwood
      #  doAfter: 2
      - material: WoodPlank
        amount: 5
