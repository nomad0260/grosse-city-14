- type: constructionGraph
  id: SelfmadeRevolver
  start: start
  graph:
  - node: start
    entity: WeaponRevolverSelfmade
    edges:
    - to: RevolverT2
      completed:
        - !type:SpawnPrototype
          prototype: WeaponRevolverSelfmadeT2
        - !type:EmptyAllContainers
        - !type:DeleteEntity
      steps:
      - tag: WoodenPieceSheet
        name: construction-insert-wooden-piece
        doAfter: 2
    - to: Shotgun
      completed:
        - !type:SpawnPrototype
          prototype: WeaponShotgunSelfmadeMini
        - !type:EmptyAllContainers
        - !type:DeleteEntity
      steps:
      - material: MetalRod
        amount: 5
        doAfter: 5
  - node: RevolverT2
    entity: WeaponRevolverSelfmadeT2
  - node: Shotgun
    entity: WeaponShotgunSelfmadeMini

- type: constructionGraph
  id: SelfmadeSMG
  start: start
  graph:
  - node: start
    entity: WeaponRevolverSelfmade
    edges:
    - to: SMGT2
      completed:
        - !type:SpawnPrototype
          prototype: WeaponSubMachineGunSelfmadeT2C17
        - !type:EmptyAllContainers
        - !type:DeleteEntity
      steps:
      - tag: WoodenPieceSheet
        name: construction-insert-wooden-piece
        doAfter: 2
      - material: Steel
        amount: 2
        doAfter: 2
    - to: BoltRifle
      completed:
        - !type:SpawnPrototype
          prototype: WeaponRifleSelfmadeBoltAction
        - !type:EmptyAllContainers
        - !type:DeleteEntity
      steps:
      - material: WoodPlank
        amount: 4
        doAfter: 3
      - material: Steel
        amount: 5
        doAfter: 2
      - tag: WoodenPieceSheet
        name: construction-insert-wooden-piece
        doAfter: 2
  - node: SMGT2
    entity: WeaponSubMachineGunSelfmadeT2C17
  - node: BoltRifle
    entity: WeaponRifleSelfmadeBoltAction
