- type: entity
  parent: [ BaseNukeopsRule, BaseRoundstartAntagRule ]
  id: Saboteurs
  components:
  - type: GameRule
    minPlayers: 20
  - type: AntagSelection
    antags:
    - !type:FixedAntagCount
      proto: ResistanceSaboteur
      count: 3
  - type: DynamicRuleCost
    cost: 200

- type: entity
  parent: [ BaseTraitorRule, BaseRoundstartAntagRule ]
  id: ResistanceAgent
  components:
  - type: GameRule
    minPlayers: 5
    delay:
      min: 240
      max: 420
  - type: AntagSelection
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: ResistanceAgent
      range:
        min: 1
        max: 8

- type: entity
  parent: BaseGameRule
  id: Smuggler
  components:
  #- type: AntagObjectives
  #  objectives:
  #  - EscapeThiefShuttleObjective
  #- type: AntagRandomObjectives
  #  sets:
  #  - groups: ThiefBigObjectiveGroups
  #    prob: 0.7
  #    maxPicks: 1
  #  - groups: ThiefObjectiveGroups
  #    maxPicks: 10
  #  maxDifficulty: 2.5
  - type: AntagSelection
    agentName: roles-antag-smuggler-name
    selectionTime: PrePlayerSpawn
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Smuggler
      playerRatio: 20
      range:
        min: 3
        max: 12
  - type: DynamicRuleCost
    cost: 75
  - type: GameRule
    cancelPresetOnTooFewPlayers: false
