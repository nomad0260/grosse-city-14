# Each patrol root below is explicitly assigned to its matching mob variant and waypoint network.
- type: htnCompound
  id: ZombiePatrolCompound
  branches:
    - tasks:
        - !type:HTNCompoundTask
          task: MeleeCombatCompound
    - tasks:
        - !type:HTNCompoundTask
          task: PatrolZombieCompound
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound

- type: htnCompound
  id: PatrolZombieCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PickPatrolPointOperator
            network: Zombie
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: false
        - !type:HTNPrimitiveTask
          operator: !type:RandomOperator
            targetKey: IdleTime
            minKey: MinimumIdleTime
            maxKey: MaximumIdleTime
        - !type:HTNPrimitiveTask
          operator: !type:WaitOperator
            key: IdleTime
          preconditions:
            - !type:KeyExistsPrecondition
              key: IdleTime

- type: htnCompound
  id: AntlionPatrolCompound
  branches:
    - tasks:
        - !type:HTNCompoundTask
          task: MeleeCombatCompound
    # The target is known but can't be reached on foot: break through what's in the way.
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyMeleeTargets
        - !type:HTNCompoundTask
          task: SmashBlockingObstacleCompound
    - tasks:
        - !type:HTNCompoundTask
          task: FollowCompound
    # Patrol before burrow: idle time also accrues while walking, so burrowing first would stop patrols mid-route.
    - tasks:
        - !type:HTNCompoundTask
          task: PatrolAntlionCompound
    - tasks:
        - !type:HTNCompoundTask
          task: AntlionBurrowCompound
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound

- type: htnCompound
  id: PatrolAntlionCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PickPatrolPointOperator
            network: Antlion
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: false
        - !type:HTNPrimitiveTask
          operator: !type:RandomOperator
            targetKey: IdleTime
            minKey: MinimumIdleTime
            maxKey: MaximumIdleTime
        - !type:HTNPrimitiveTask
          operator: !type:WaitOperator
            key: IdleTime
          preconditions:
            - !type:KeyExistsPrecondition
              key: IdleTime

- type: htnCompound
  id: HeadcrabPatrolCompound
  branches:
    - tasks:
        - !type:HTNCompoundTask
          task: MeleeCombatCompound
    - tasks:
        - !type:HTNCompoundTask
          task: PatrolHeadcrabCompound
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound

- type: htnCompound
  id: PatrolHeadcrabCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PickPatrolPointOperator
            network: Headcrab
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: false
        - !type:HTNPrimitiveTask
          operator: !type:RandomOperator
            targetKey: IdleTime
            minKey: MinimumIdleTime
            maxKey: MaximumIdleTime
        - !type:HTNPrimitiveTask
          operator: !type:WaitOperator
            key: IdleTime
          preconditions:
            - !type:KeyExistsPrecondition
              key: IdleTime
