# Добивание беспомощной (критической) добычи: NPC бьёт тело, пока оно не
# развалится на гибы.
# Ветка не выбирается, если у NPC нет NpcDevour.
- type: htnCompound
  id: DevourCritCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyCritTargets
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            targetKey: TargetCoordinates
            pathfindInPlanning: true
            shutdownState: TaskFinished
            rangeKey: MeleeRange
        - !type:HTNPrimitiveTask
          operator: !type:DevourOperator
            targetKey: Target
