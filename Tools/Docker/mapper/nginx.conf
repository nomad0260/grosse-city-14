worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_zone $binary_remote_addr zone=req:10m rate=2r/s;

    upstream game_status {
        server 127.0.0.1:1213;
    }

    server {
        listen 1212;
        listen [::]:1212;
        server_name _;
        limit_conn perip 20;

        location = /status {
            proxy_pass http://game_status;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /info {
            proxy_pass http://game_status;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /players {
            proxy_pass http://game_status;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /manifest.txt {
            proxy_pass http://game_status;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location /download {
            proxy_pass http://game_status;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 300s;
            client_max_body_size 0;
        }

        location = /rt_transfer_init {
            proxy_pass http://game_status;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
        }

        location = / {
            root /var/www/mapper;
            try_files /index.html =404;
        }

        location = /nginx_status {
            stub_status;
        }

        location ~* ^/files/.*\.db(-wal|-shm)?$ {
            deny all;
        }

        location ^~ /files/logs/ {
            deny all;
        }

        location /files/ {
            alias /data/;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
            charset utf-8;
            limit_rate 30k;
            limit_conn perip 8;
            limit_req zone=req burst=4;
        }

        location / {
            return 404;
        }
    }
}
